<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🩸 LifeDrop</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <header>
    <span>🩸</span>
    <h1>LifeDrop</h1>
    <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
      <span id="user-name" style="font-size:12px;opacity:.85;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      <button id="logout-btn" style="padding:5px 10px;background:rgba(255,255,255,.2);color:#fff;border:none;border-radius:7px;font-size:11px;cursor:pointer;font-weight:600">Logout</button>
    </div>
  </header>

  <!-- NAV -->
  <nav>
    <button class="active" onclick="showPage('search',this)">🔍 Find Blood</button>
    <button onclick="showPage('requests',this);loadMyRequests()">📋 My Requests</button>
    <button onclick="showPage('myprofile',this)">👤 My Profile</button>
  </nav>

  <!-- FIND BLOOD PAGE -->
  <div class="page active" id="page-search">
    <div class="search-bar">
      <select id="blood-filter">
        <option value="">Blood Group</option>
        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
        <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
      </select>
      <button class="search-btn" onclick="searchDonors()">খুঁজি</button>
    </div>
    <div id="map"></div>
    <div class="results-list" id="results-list">
      <h3>Blood group দিয়ে search করো</h3>
    </div>
  </div>

  <!-- MY REQUESTS PAGE -->
  <div class="page" id="page-requests">
    <div class="requests-page">
      <h2 style="font-size:17px;font-weight:700;margin-bottom:12px">আমার Requests</h2>
      <div id="requests-list">
        <p style="color:#aaa;text-align:center;padding:20px">লোড হচ্ছে...</p>
      </div>
    </div>
  </div>

  <!-- MY PROFILE PAGE -->
  <div class="page" id="page-myprofile">
    <div class="profile-page">
      <h2>My Profile</h2>
      <div id="my-profile-content"></div>
    </div>
  </div>

</div>

<!-- REQUEST MODAL -->
<div class="modal-bg" id="modal-bg" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">রক্তের অনুরোধ</h3>
      <button class="modal-close" onclick="document.getElementById('modal-bg').classList.remove('open')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="req-donor-id"/>
      <input type="hidden" id="req-donor-name"/>
      <input type="hidden" id="req-blood"/>
      <p style="font-size:13px;color:#666;margin-bottom:8px">কোন হাসপাতাল, কখন লাগবে, রোগীর অবস্থা লিখুন:</p>
      <textarea id="req-msg" placeholder="যেমন: Dhaka Medical, আজ রাত ৮টার মধ্যে, O+ blood urgent..."></textarea>
      <button id="req-submit-btn" class="submit-btn" onclick="sendRequest()">পাঠাও</button>
    </div>
  </div>
</div>

<!-- LOADING OVERLAY -->
<div id="loading" class="loading-overlay">
  <div class="spinner"></div>
  <p style="color:#c0392b;font-weight:600;font-size:13px">লোড হচ্ছে...</p>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
function showPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  btn.classList.add('active');
}
</script>

<script type="module" src="app.js"></script>
</body>
</html>
