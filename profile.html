<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="sondhan-logo.png"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#c0392b"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>Sondhan — Profile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%;overflow-x:hidden;-webkit-text-size-adjust:100%}
html,body{width:100%;max-width:100%}
body{min-height:100%;min-height:100dvh;font-family:'Inter','Hind Siliguri',sans-serif;background:#f5f5f5;margin:0;padding:0;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:stretch;overflow-x:hidden}
.app{width:100%;max-width:480px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:100dvh;background:#f5f5f5}
.header{background:linear-gradient(135deg,#c0392b,#e74c3c);padding:12px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:260;width:100%}
.hl{display:flex;align-items:center;gap:8px;min-width:0}
.hl h1{color:#fff;font-size:17px;font-weight:800;min-width:0;flex:1}
.scr{flex:1;min-height:0;width:100%;min-width:0;overflow-x:hidden;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px;padding-bottom:88px;-webkit-overflow-scrolling:touch}

/* PROFILE HERO */
.profile-hero,.info-card,.history-card,.avail-card,.not-donor-box{width:100%;max-width:100%}
.profile-hero{background:#fff;border-radius:16px;padding:20px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.p-avatar-wrap{position:relative;width:88px;height:88px;margin:0 auto 14px;cursor:pointer}
.p-avatar{width:88px;height:88px;border-radius:50%;background:linear-gradient(135deg,#fdecea,#fde);border:3px solid #c0392b;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:#c0392b;overflow:hidden}
.p-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.p-camera{position:absolute;bottom:0;right:0;background:#c0392b;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;border:2px solid #fff}
.p-name{font-size:19px;font-weight:800;color:#222;margin-bottom:5px}
.p-blood{display:inline-block;background:#c0392b;color:#fff;font-size:12px;font-weight:700;padding:3px 14px;border-radius:20px;margin-bottom:6px}
.p-location{font-size:11px;color:#aaa;font-family:'Hind Siliguri',sans-serif}

/* AVAIL TOGGLE */
.avail-card{border-radius:14px;padding:14px;display:flex;align-items:center;gap:12px}
.avail-card.on{background:linear-gradient(135deg,#d5f5e3,#eafaf1);border:1.5px solid #27ae60}
.avail-card.off{background:linear-gradient(135deg,#fdecea,#fff5f5);border:1.5px solid #e74c3c}
.avail-text{flex:1}
.avail-t1{font-size:14px;font-weight:700;font-family:'Hind Siliguri',sans-serif;margin-bottom:2px}
.avail-card.on .avail-t1{color:#1e8449}
.avail-card.off .avail-t1{color:#c0392b}
.avail-t2{font-size:11px;font-family:'Hind Siliguri',sans-serif}
.avail-card.on .avail-t2{color:#27ae60}
.avail-card.off .avail-t2{color:#e74c3c}
.tog{width:50px;height:28px;border-radius:28px;position:relative;cursor:pointer;border:none;outline:none;transition:.3s;flex-shrink:0}
.tog.on{background:#27ae60}
.tog.off{background:#ddd}
.tog-circle{position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:3px;transition:.3s;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tog.on .tog-circle{right:3px;left:auto}
.tog.off .tog-circle{left:3px}

/* INFO CARD */
.info-card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.info-title{font-size:12px;font-weight:700;color:#c0392b;margin-bottom:11px;padding-bottom:8px;border-bottom:1px solid #fde;font-family:'Hind Siliguri',sans-serif}
.info-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #f5f5f5}
.info-row:last-child{border-bottom:none}
.info-ico{font-size:16px;width:24px;text-align:center;flex-shrink:0}
.info-label{font-size:11px;color:#aaa;font-family:'Hind Siliguri',sans-serif;width:85px;flex-shrink:0}
.info-val{font-size:13px;font-weight:600;color:#333;font-family:'Hind Siliguri',sans-serif;flex:1;min-width:0;word-break:break-word}
.info-val.na{color:#bbb;font-style:italic;font-weight:400;font-size:11px}

/* HISTORY */
.history-card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.hist-row{display:flex;align-items:center;gap:12px;background:#fafafa;border-radius:12px;padding:12px}
.hist-num{width:42px;height:42px;background:#c0392b;color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;flex-shrink:0}
.hist-info{min-width:0;flex:1}
.hist-info h4{font-size:13px;font-weight:700;font-family:'Hind Siliguri',sans-serif;margin-bottom:2px}
.hist-info p{font-size:11px;color:#aaa;font-family:'Hind Siliguri',sans-serif}

/* BUTTONS */
.edit-btn{width:100%;padding:12px;background:#fff;color:#c0392b;border:1.5px solid #c0392b;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Hind Siliguri',sans-serif}
.logout-btn-big{width:100%;padding:13px;background:#fff;color:#e74c3c;border:1.5px solid #e74c3c;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Hind Siliguri',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px}
.logout-btn-big:hover{background:#fdecea}
.settings-row{width:100%;display:flex;align-items:center;gap:11px;background:#fff;border:1px solid #eee;border-radius:12px;padding:13px;margin-bottom:10px;cursor:pointer;text-decoration:none;color:inherit;font-family:'Hind Siliguri',sans-serif}
.settings-row-i{font-size:17px;flex-shrink:0;width:22px;text-align:center}
.settings-row-t{flex:1;font-size:13.5px;font-weight:600;color:#333;text-align:left}
.settings-row-a{color:#ccc;font-size:16px;flex-shrink:0}
.not-donor-box{background:#fff;border-radius:16px;padding:24px;text-align:center;box-shadow:0 1px 6px rgba(0,0,0,.06)}

/* MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;padding-bottom:24px}
.modal-header{background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;padding:14px 16px;border-radius:24px 24px 0 0;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:15px;font-weight:700;font-family:'Hind Siliguri',sans-serif}
.modal-close{background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.modal-body{padding:16px}
.form-group{margin-bottom:12px}
.form-group label{font-size:12px;font-weight:600;color:#666;display:block;margin-bottom:5px;font-family:'Hind Siliguri',sans-serif}
.form-group .hint{font-size:11px;color:#aaa;margin-top:3px;font-family:'Hind Siliguri',sans-serif}
.iw{display:flex;align-items:center;background:#f8f8f8;border:1.5px solid #eee;border-radius:12px;padding:0 13px;transition:.2s}
.iw:focus-within{border-color:#c0392b;background:#fff}
.iw input,.iw select{flex:1;border:none;background:transparent;padding:12px 0;font-size:14px;outline:none;font-family:'Hind Siliguri',sans-serif;color:#222}
.iw.disabled{background:#f0f0f0;opacity:.7}
.iw.disabled input{color:#aaa}
.form-row{display:flex;gap:8px}
.form-row .form-group{flex:1}
.submit-btn{width:100%;padding:13px;background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Hind Siliguri',sans-serif;margin-top:4px}
.submit-btn:disabled{background:#e0a0a0;cursor:not-allowed}
.section-divider{font-size:12px;font-weight:700;color:#888;margin:16px 0 10px;font-family:'Hind Siliguri',sans-serif;padding-bottom:6px;border-bottom:1px solid #f0f0f0}

/* BNAV */

.loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:9999;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.spinner{width:38px;height:38px;border:4px solid #fde;border-top-color:#c0392b;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;z-index:9999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;font-family:'Hind Siliguri',sans-serif}
.toast.show{opacity:1}


/* ── আইকন ── */
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:block}
.ic-sm{width:15px;height:15px}
.ic-lg{width:21px;height:21px}
.ic-tile{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ══ প্রোফাইল (পলিশড) ══ */
.p-top{background:#C0392B;margin:-12px -12px 0;padding:20px 15px 46px}
.p-avatar-wrap{margin:-38px auto 0;position:relative;width:84px;cursor:pointer}
.p-avatar{width:84px;height:84px;border-radius:50%;border:3px solid #fff;overflow:hidden;background:#FDECEA;display:flex;align-items:center;justify-content:center;color:#C0392B;font-family:'Inter',sans-serif;font-size:27px;font-weight:700;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.p-avatar img{width:100%;height:100%;object-fit:cover}
.p-camera{position:absolute;bottom:0;right:0;width:26px;height:26px;border-radius:50%;background:#C0392B;border:2px solid #fff;display:flex;align-items:center;justify-content:center;color:#fff}
.p-id{text-align:center;margin-top:11px}
.p-name{font-size:18px;font-weight:800;color:#1A1A1A;font-family:'Hind Siliguri',sans-serif}
.p-blood{display:inline-block;background:#C0392B;color:#fff;font-family:'Inter',sans-serif;font-size:12px;font-weight:700;padding:3px 15px;border-radius:20px;margin:7px 0 6px}
.p-location{font-size:11px;color:#B4B4B4;display:flex;align-items:center;justify-content:center;gap:5px;font-family:'Hind Siliguri',sans-serif}
.sec-label{font-size:12px;color:#8E8E8E;margin:18px 0 10px;font-weight:600;font-family:'Hind Siliguri',sans-serif}

/* যোগ্যতা কার্ড */
.elig{border-radius:13px;padding:15px;margin:16px 0 10px}
.elig.ready{background:#F2F9F2;border:1px solid #CFE4CF}
.elig.wait{background:#FDF8EE;border:1px solid #F0E0BE}
.elig-top{display:flex;align-items:center;gap:11px}
.elig.wait .elig-top{margin-bottom:12px}
.elig-t{font-size:14px;font-weight:700;font-family:'Hind Siliguri',sans-serif}
.elig-s{font-size:11px;margin-top:2px;font-family:'Hind Siliguri',sans-serif;line-height:1.5}
.elig.ready .elig-t{color:#2E7D32} .elig.ready .elig-s{color:#5C8A5C}
.elig.wait .elig-t{color:#8A6410} .elig.wait .elig-s{color:#A38B4E}
.bar{height:6px;border-radius:6px;background:rgba(0,0,0,.07);overflow:hidden}
.bar-fill{height:100%;border-radius:6px;background:#C9962C}
.elig-foot{display:flex;justify-content:space-between;margin-top:7px;font-size:10px;color:#A38B4E;font-family:'Hind Siliguri',sans-serif}

/* প্রস্তুতি কার্ড */
.avail-card{display:flex;align-items:center;gap:12px;border-radius:13px;padding:14px;margin-bottom:10px}
.avail-card.on{background:#F2F9F2;border:1px solid #CFE4CF}
.avail-card.off{background:#FDF3F2;border:1px solid #F2D5D1}
.avail-text{flex:1;min-width:0}
.avail-t1{font-size:13.5px;font-weight:700;font-family:'Hind Siliguri',sans-serif}
.avail-t2{font-size:11px;margin-top:2px;font-family:'Hind Siliguri',sans-serif}
.avail-card.on .avail-t1{color:#2E7D32} .avail-card.on .avail-t2{color:#5C8A5C}
.avail-card.off .avail-t1{color:#C0392B} .avail-card.off .avail-t2{color:#B07770}

/* তথ্য কার্ড */
.info-card{background:#fff;border:1px solid #EBEBEB;border-radius:13px;padding:3px 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.info-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid #F4F4F4}
.info-row:last-child{border-bottom:none}
.info-ico2{color:#8E8E8E;flex-shrink:0}
.info-label{font-size:11px;color:#B4B4B4;width:78px;flex-shrink:0;font-family:'Hind Siliguri',sans-serif}
.info-val{font-size:12.5px;font-weight:600;color:#1A1A1A;flex:1;font-family:'Inter','Hind Siliguri',sans-serif;word-break:break-word}
.info-val.na{color:#B4B4B4;font-weight:400;font-size:11.5px;font-style:italic}

/* ইতিহাস */
.hist-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #EBEBEB;border-radius:13px;padding:13px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.hist-n{width:38px;height:38px;border-radius:50%;background:#C0392B;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Inter',sans-serif;font-size:15px;font-weight:700;flex-shrink:0}
.hist-t{font-size:12.5px;font-weight:700;color:#1A1A1A;font-family:'Hind Siliguri',sans-serif}
.hist-s{font-size:11px;color:#8E8E8E;margin-top:3px;font-family:'Hind Siliguri',sans-serif}
.hist-zero{background:#fff;border:1px dashed #DCDCDC;border-radius:13px;padding:20px 15px;text-align:center}
.hist-zero-t{font-size:13px;font-weight:700;color:#5C5C5C;margin-top:9px;font-family:'Hind Siliguri',sans-serif}
.hist-zero-s{font-size:11px;color:#B4B4B4;margin-top:4px;line-height:1.6;font-family:'Hind Siliguri',sans-serif}

/* রক্তদাতা নন — খালি অবস্থা */
.not-donor-box{background:#fff;border:1px solid #EBEBEB;border-radius:13px;padding:24px 18px;text-align:center;margin-top:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.not-donor-box h3{font-size:15px;font-weight:800;color:#1A1A1A;font-family:'Hind Siliguri',sans-serif;margin-bottom:7px}
.not-donor-box p{font-size:12px;color:#8E8E8E;font-family:'Hind Siliguri',sans-serif;line-height:1.7;margin-bottom:16px}
.nd-btn{display:inline-flex;align-items:center;gap:7px;padding:12px 22px;background:#C0392B;color:#fff;border-radius:12px;font-size:13.5px;font-weight:700;text-decoration:none;font-family:'Hind Siliguri',sans-serif}

/* সেটিংস সারি */
.settings-row{width:100%;display:flex;align-items:center;gap:11px;background:#fff;border:1px solid #EBEBEB;border-radius:13px;padding:13px;margin-bottom:9px;cursor:pointer;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.05);font-family:'Hind Siliguri',sans-serif}
.settings-row-i2{color:#8E8E8E;flex-shrink:0}
.settings-row-t{flex:1;font-size:13px;font-weight:700;color:#5C5C5C;text-align:left}
.settings-row-a2{color:#B4B4B4;flex-shrink:0}
.logout-btn-big{width:100%;padding:13px;border-radius:13px;border:1px solid #C0392B;background:#fff;color:#C0392B;font-family:'Hind Siliguri',sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;margin-top:14px}
</style>
</head>
<body>

  <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21l8.8-8.3a5 5 0 0 0 0-7.1z"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M8 3v4M16 3v4M3 10h18"/></symbol>
  <symbol id="i-mail" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="m2 7 10 6 10-6"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></symbol>
  <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5M21 12H9"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-hospital" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14"/><path d="M12 9v6M9 12h6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
  <symbol id="i-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></symbol>

  try {

      getDoc(doc(db,'users',CU.uid)),
      getDoc(doc(db,'donors',CU.uid)),
      getDoc(doc(db,'donorsPrivate',CU.uid))

    DD = ds.exists() ? { ...ds.data(), ...(ps.exists() ? ps.data() : {}) } : null;
  } catch(e){
    UD = {name:CU.displayName||'',email:CU.email,isDonor:false};
    DD = null;
  }
}

    await updateDoc(doc(db,'donors',CU.uid),{available:val});

    DD.available = val; toast(val?'রক্ত দিতে প্রস্তুত':'রক্ত দিতে অপ্রস্তুত'); render();

};

// PHOTO
window.pickPhoto = () => document.getElementById('photo-inp')?.click();
window.uploadPhoto = inp => {
  const f = inp.files[0]; if(!f) return;
  if(!/^image\//.test(f.type)){ toast('ছবির ফাইল বেছে নিন'); inp.value=''; return; }
  const reader = new FileReader();
  reader.onerror = () => { toast('ছবি পড়া যায়নি'); inp.value=''; };
  reader.onload = async e => {
    const img = new Image();
    img.onerror = () => { toast('ছবিটি ব্যবহার করা যাচ্ছে না'); inp.value=''; };
    img.onload = async () => {
      // BUGFIX: Firestore-এর ডকুমেন্ট সীমা ১MB। আগে সীমা ছাড়ালে
      // নীরবে ব্যর্থ হতো। এখন quality কমিয়ে সীমার ভেতরে আনা হয়,
      // তাতেও না হলে ইউজারকে স্পষ্ট করে জানানো হয়।
      const MAX = 640;                       // ৮০০ → ৬৪০, আকার অনেক কমে
      let w = img.width, h = img.height;
      if (w > h) { if (w > MAX) { h = Math.round(h * (MAX / w)); w = MAX; } }
      else       { if (h > MAX) { w = Math.round(w * (MAX / h)); h = MAX; } }

      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);

      const LIMIT = 700 * 1024;              // ১MB সীমার নিরাপদ ভেতরে
      let b64 = '', q = 0.8;
      for (let i = 0; i < 5; i++) {
        b64 = canvas.toDataURL('image/jpeg', q);
        if (b64.length <= LIMIT) break;
        q -= 0.15;
        if (q < 0.3) break;
      }
      if (b64.length > LIMIT) { toast('ছবিটি খুব বড় — ছোট একটি ছবি দিন'); inp.value=''; return; }

      setLoad(true);
      try {
        await updateDoc(doc(db,'donors',CU.uid),{photo:b64});
        try{ await updateDoc(doc(db,'users',CU.uid),{photo:b64}); }catch(_){}
        if(DD) DD.photo = b64;
        toast('ছবি আপলোড হয়েছে');
        render();
      } catch(err){
        toast('ছবি সেভ করা যায়নি');
        console.warn('photo upload:', err);
      } finally {
        setLoad(false);
        inp.value = '';
      }
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(f);
};

      <p class="hint">ইমেইল পরিবর্তন করা যাবে না</p></div>

    <div class="section-divider">রক্তের তথ্য</div>
    <div class="form-row">
      <div class="form-group"><label>Blood Group *</label>
        <div class="iw"><select id="e-blood">
          ${['A+','A-','B+','B-','AB+','AB-','O+','O-'].map(b=>`<option ${b===d.blood?'selected':''}>${b}</option>`).join('')}
        </select></div></div>
      <div class="form-group"><label>মোট রক্তদান (বার)</label>
        <div class="iw"><input type="number" id="e-donations" value="${esc(d.donations||0)}" min="0"/></div></div>
    </div>
    <div class="form-group"><label>সর্বশেষ রক্তদানের তারিখ</label>
      <div class="iw"><input type="date" id="e-last" value="${esc(d.lastDonation||'')}"/></div></div>

    <div class="section-divider">অবস্থান</div>
    <div class="form-group"><label>এলাকা</label>
      <div class="iw"><input id="e-area" value="${esc(d.area||'')}"/></div></div>

    <button class="submit-btn" onclick="saveEdit()">সংরক্ষণ করুন</button>`;
  document.getElementById('edit-modal').classList.add('open');
};
window.closeEdit = () => document.getElementById('edit-modal').classList.remove('open');

window.saveEdit = async () => {
  const name      = document.getElementById('e-name').value.trim();
  const phone     = document.getElementById('e-phone').value.trim();
  const wa        = document.getElementById('e-wa').value.trim();
  const blood     = document.getElementById('e-blood').value;
  const donations = parseInt(document.getElementById('e-donations').value)||0;
  const last      = document.getElementById('e-last').value;
  const area      = document.getElementById('e-area').value.trim();
  if(!name||!phone){ toast('নাম ও ফোন দিন'); return; }
  if(!isValidBdPhone(phone)){ toast('সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)'); return; }
  if(wa && !isValidBdPhone(wa)){ toast('WhatsApp নম্বর সঠিক নয়'); return; }
  const normPhone = normalizeBdPhone(phone);
  const normWa    = wa ? normalizeBdPhone(wa) : '';

  setLoad(true);
  try {
    // BUGFIX: ফোন/WhatsApp এখন donorsPrivate-এ (public donors ডকে নেই)
    // — search-এ তালিকা টানলে নম্বর আর client-এ আসে না।
    await updateDoc(doc(db,'donors',CU.uid),{name,blood,donations,lastDonation:last||null,area});
    await setDoc(doc(db,'donorsPrivate',CU.uid),{phone:normPhone,wa:normWa},{merge:true});
    try{ await updateDoc(doc(db,'users',CU.uid),{name,blood}); }catch(e){}
    Object.assign(DD,{name,phone:normPhone,wa:normWa,blood,donations,lastDonation:last||null,area});
    closeEdit(); toast('প্রোফাইল আপডেট হয়েছে'); render();
  } catch(e){ toast('সেভ করা যায়নি — আবার চেষ্টা করুন'); console.warn(e); }
  finally{ setLoad(false); }
};

// PASSWORD CHANGE
window.openPassModal = () => {
  document.getElementById('cur-pass').value='';
  document.getElementById('new-pass').value='';
  document.getElementById('new-pass2').value='';
  document.getElementById('pass-err').style.display='none';
  document.getElementById('pass-modal').classList.add('open');
};
window.closePassModal = () => document.getElementById('pass-modal').classList.remove('open');

window.changePassword = async () => {
  const cur  = document.getElementById('cur-pass').value;
  const nw   = document.getElementById('new-pass').value;
  const nw2  = document.getElementById('new-pass2').value;
  const errEl = document.getElementById('pass-err');
  errEl.style.display='none';

  if(!cur||!nw||!nw2){ showPassErr('সব তথ্য পূরণ করুন'); return; }
  if(nw.length<6){ showPassErr('নতুন পাসওয়ার্ড কমপক্ষে ৬ অক্ষর'); return; }
  if(nw!==nw2){ showPassErr('নতুন পাসওয়ার্ড দুটো মিলছে না'); return; }

  const btn = document.getElementById('pass-btn');
  btn.disabled=true; btn.textContent='পরিবর্তন হচ্ছে...';
  try {
    const cred = EmailAuthProvider.credential(CU.email, cur);
    await reauthenticateWithCredential(CU, cred);
    await updatePassword(CU, nw);
    closePassModal(); toast('পাসওয়ার্ড পরিবর্তন হয়েছে');
  } catch(e){
    if(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential')
      showPassErr('বর্তমান পাসওয়ার্ড ভুল।');
    else { showPassErr('পাসওয়ার্ড পরিবর্তন করা যায়নি'); console.warn(e); }
  } finally{ btn.disabled=false; btn.textContent='পাসওয়ার্ড পরিবর্তন করুন'; }
};
function showPassErr(m){ const e=document.getElementById('pass-err'); e.textContent=m; e.style.display='block'; }

window.doLogout = async () => {
  if(!confirm('লগআউট করবেন?')) return;
  await signOut(auth);
  window.location.replace('index.html');
};

function ini(n){ return(n||'D').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase(); }
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2700); }
function setLoad(v){ document.getElementById('loading').classList.toggle('show',v); }
</script>
<div class="install-banner" id="install-banner">
  <div class="install-modal">
    <div class="install-modal-icon"><img src="icon-192.png" alt="Sondhan"/></div>
    <div class="install-modal-title">Sondhan ইনস্টল করুন</div>
    <div class="install-modal-sub">ভালো অভিজ্ঞতার জন্য অ্যাপটি ডাউনলোড করুন</div>
    <button class="install-modal-btn" onclick="installApp()">ইনস্টল করুন</button>
    <div class="install-modal-later" onclick="dismissInstall()">পরে করবো</div>
  </div>
</div>
<script>
(function(){
  var deferredPrompt = null;
  var shown = false;
  var KEY = 'sondhan-install-dismissed-at';
  var COOLDOWN = 7 * 24 * 60 * 60 * 1000; // ৭ দিন পর আবার দেখাবে

  function isInstalled(){
    return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  }
  function recentlyDismissed(){
    var t = localStorage.getItem(KEY);
    return t && (Date.now() - parseInt(t, 10)) < COOLDOWN;
  }
  function showBanner(){
    if (shown || !deferredPrompt || isInstalled() || recentlyDismissed()) return;
    shown = true;
    document.getElementById('install-banner').classList.add('show');
  }

  window.addEventListener('beforeinstallprompt', function(e){
    e.preventDefault();
    deferredPrompt = e;
    setTimeout(showBanner, 10000); // অ্যাপে ঢোকার ১০ সেকেন্ড পর
  });

  window.installApp = function(){
    document.getElementById('install-banner').classList.remove('show');
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(choice){
      deferredPrompt = null;
      if (choice.outcome !== 'accepted') localStorage.setItem(KEY, Date.now().toString());
    });
  };

  window.dismissInstall = function(){
    document.getElementById('install-banner').classList.remove('show');
    localStorage.setItem(KEY, Date.now().toString());
  };

  window.addEventListener('appinstalled', function(){
    document.getElementById('install-banner').classList.remove('show');
  });

  document.getElementById('install-banner').addEventListener('click', function(e){
    if (e.target.id === 'install-banner') window.dismissInstall();
  });
})();
</script>
