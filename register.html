<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeDrop — নিবন্ধন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Hind Siliguri',sans-serif;background:#f5f5f5;min-height:100vh}
.topbar{background:linear-gradient(135deg,#c0392b,#e74c3c);padding:14px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.back{color:#fff;font-size:22px;text-decoration:none;line-height:1;background:rgba(255,255,255,.2);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.topbar h2{color:#fff;font-size:16px;font-weight:700;font-family:'Hind Siliguri',sans-serif}
.body{padding:16px;max-width:480px;margin:0 auto}
.err{background:#fdecea;color:#c0392b;padding:11px 14px;border-radius:11px;font-size:13px;margin-bottom:16px;border-left:3px solid #c0392b;display:none;font-family:'Hind Siliguri',sans-serif}
.section{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,.05)}
.sec-title{font-size:13px;font-weight:700;color:#c0392b;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #fde;font-family:'Hind Siliguri',sans-serif;display:flex;align-items:center;gap:6px}
.input-wrap{display:flex;align-items:center;background:#f8f8f8;border:1.5px solid #eee;border-radius:12px;padding:0 14px;margin-bottom:11px;transition:.2s}
.input-wrap:last-child{margin-bottom:0}
.input-wrap:focus-within{border-color:#c0392b;background:#fff}
.iico{font-size:16px;margin-right:10px;opacity:.6;flex-shrink:0}
.input-wrap input,.input-wrap select{flex:1;border:none;background:transparent;padding:13px 0;font-size:14px;color:#222;outline:none;font-family:'Inter','Hind Siliguri',sans-serif}
.eye{background:none;border:none;font-size:15px;opacity:.35;padding:4px;cursor:pointer}
/* date toggle */
.date-row{display:flex;align-items:center;gap:10px;background:#f8f8f8;border:1.5px solid #eee;border-radius:12px;padding:12px 14px;margin-bottom:11px;transition:.2s}
.date-row:focus-within{border-color:#c0392b}
.date-row input[type=date]{flex:1;border:none;background:transparent;font-size:14px;color:#222;outline:none;font-family:'Inter',sans-serif}
.never-row{display:flex;align-items:center;gap:10px;padding:4px 2px;margin-bottom:4px;cursor:pointer}
.never-row input[type=checkbox]{width:18px;height:18px;accent-color:#c0392b;cursor:pointer}
.never-row label{font-size:13px;color:#666;font-family:'Hind Siliguri',sans-serif;cursor:pointer}
/* location */
.loc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:11px}
.loc-grid .input-wrap{margin-bottom:0}
/* urgent toggle */
.urgent-row{display:flex;align-items:center;gap:12px}
.urgent-text .t1{font-size:14px;font-weight:700;font-family:'Hind Siliguri',sans-serif}
.urgent-text .t2{font-size:11px;color:#aaa;margin-top:2px;font-family:'Hind Siliguri',sans-serif}
.urgent-text{flex:1}
.toggle-sw{position:relative;width:46px;height:26px;flex-shrink:0}
.toggle-sw input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#ddd;border-radius:26px;cursor:pointer;transition:.3s}
.slider:before{content:'';position:absolute;width:20px;height:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-sw input:checked+.slider{background:#c0392b}
.toggle-sw input:checked+.slider:before{transform:translateX(20px)}
/* submit */
.submit-btn{width:100%;padding:15px;background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 5px 16px rgba(192,57,43,.3);font-family:'Hind Siliguri',sans-serif;transition:.2s;margin-top:4px}
.submit-btn:active{transform:scale(.98)}
.submit-btn:disabled{background:#e0a0a0;box-shadow:none;cursor:not-allowed}
.login-link{text-align:center;margin-top:14px;font-size:13px;color:#aaa;font-family:'Hind Siliguri',sans-serif}
.login-link a{color:#c0392b;font-weight:700;text-decoration:none}
</style>
</head>
<body>

<div class="topbar">
  <a href="login.html" class="back">←</a>
  <h2>নতুন রক্তদাতা নিবন্ধন</h2>
</div>

<div class="body">
  <div id="err" class="err"></div>

  <!-- ব্যক্তিগত তথ্য -->
  <div class="section">
    <div class="sec-title">👤 ব্যক্তিগত তথ্য</div>
    <div class="input-wrap">
      <span class="iico">👤</span>
      <input type="text" id="r-name" placeholder="পূর্ণ নাম *"/>
    </div>
    <div class="input-wrap">
      <span class="iico">✉️</span>
      <input type="email" id="r-email" placeholder="ই-মেইল ঠিকানা *"/>
    </div>
    <div class="input-wrap">
      <span class="iico">📞</span>
      <input type="tel" id="r-phone" placeholder="ফোন নম্বর * (01XXXXXXXXX)"/>
    </div>
    <div class="input-wrap">
      <span class="iico">🔒</span>
      <input type="password" id="r-pass" placeholder="পাসওয়ার্ড * (কমপক্ষে ৬ অক্ষর)"/>
      <button class="eye" onclick="toggleEye('r-pass')">👁</button>
    </div>
  </div>

  <!-- রক্তের তথ্য -->
  <div class="section">
    <div class="sec-title">🩸 রক্তের তথ্য</div>
    <div class="input-wrap">
      <span class="iico">🩸</span>
      <select id="r-blood">
        <option value="">রক্তের গ্রুপ বেছে নিন *</option>
        <option>A+</option><option>A-</option>
        <option>B+</option><option>B-</option>
        <option>AB+</option><option>AB-</option>
        <option>O+</option><option>O-</option>
      </select>
    </div>

    <!-- date field -->
    <div style="font-size:12px;font-weight:700;color:#555;margin-bottom:6px;font-family:'Hind Siliguri',sans-serif;padding-left:2px">সর্বশেষ রক্তদানের তারিখ</div>
    <div class="date-row" id="date-row">
      <span class="iico">📅</span>
      <input type="date" id="r-lastdate"/>
    </div>

    <!-- never donated toggle -->
    <div class="never-row" onclick="toggleNever()">
      <input type="checkbox" id="never-check"/>
      <label for="never-check">এখনো রক্ত দেইনি</label>
    </div>
  </div>

  <!-- অবস্থান -->
  <div class="section">
    <div class="sec-title">📍 অবস্থান</div>
    <div class="loc-grid">
      <div class="input-wrap">
        <span class="iico">🗺️</span>
        <select id="r-division" onchange="fillDistricts()">
          <option value="">বিভাগ *</option>
          <option>ঢাকা</option><option>চট্টগ্রাম</option>
          <option>খুলনা</option><option>রাজশাহী</option>
          <option>রংপুর</option><option>সিলেট</option>
          <option>বরিশাল</option><option>ময়মনসিংহ</option>
        </select>
      </div>
      <div class="input-wrap">
        <span class="iico">📌</span>
        <select id="r-district">
          <option value="">জেলা *</option>
        </select>
      </div>
    </div>
    <div class="input-wrap">
      <span class="iico">🏘️</span>
      <input type="text" id="r-area" placeholder="এলাকা / থানা (যেমন:হাজিগঞ্জ)"/>
    </div>
  </div>

  <!-- জরুরি -->
  <div class="section">
    <div class="urgent-row">
      <div class="urgent-text">
        <div class="t1">⚡ জরুরি রক্তদানের জন্য প্রস্তুত</div>
        <div class="t2">চালু থাকলে জরুরি অনুরোধে অগ্রাধিকার পাবেন</div>
      </div>
      <label class="toggle-sw">
        <input type="checkbox" id="r-urgent" checked/>
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <button class="submit-btn" id="reg-btn" onclick="register()">🩸 নিবন্ধন করুন</button>
  <p class="login-link">আগেই নিবন্ধিত? <a href="login.html">লগইন করুন</a></p>
</div>

<script>
const DISTRICTS = {
  'ঢাকা'      :['ঢাকা','গাজীপুর','নারায়ণগঞ্জ','মানিকগঞ্জ','মুন্সীগঞ্জ','নরসিংদী','ফরিদপুর','গোপালগঞ্জ','মাদারীপুর','রাজবাড়ী','শরীয়তপুর','কিশোরগঞ্জ','টাঙ্গাইল'],
  'চট্টগ্রাম':['চট্টগ্রাম','কক্সবাজার','কুমিল্লা','ফেনী','নোয়াখালী','লক্ষ্মীপুর','চাঁদপুর','ব্রাহ্মণবাড়িয়া','রাঙামাটি','খাগড়াছড়ি','বান্দরবান'],
  'খুলনা'    :['খুলনা','বাগেরহাট','সাতক্ষীরা','যশোর','নড়াইল','মাগুরা','ঝিনাইদহ','কুষ্টিয়া','মেহেরপুর','চুয়াডাঙ্গা'],
  'রাজশাহী'  :['রাজশাহী','নাটোর','নওগাঁ','চাঁপাইনবাবগঞ্জ','পাবনা','সিরাজগঞ্জ','বগুড়া','জয়পুরহাট'],
  'রংপুর'    :['রংপুর','গাইবান্ধা','কুড়িগ্রাম','লালমনিরহাট','নীলফামারী','ঠাকুরগাঁও','পঞ্চগড়','দিনাজপুর'],
  'সিলেট'    :['সিলেট','মৌলভীবাজার','হবিগঞ্জ','সুনামগঞ্জ'],
  'বরিশাল'   :['বরিশাল','ভোলা','পটুয়াখালী','পিরোজপুর','ঝালকাঠি','বরগুনা'],
  'ময়মনসিংহ':['ময়মনসিংহ','জামালপুর','শেরপুর','নেত্রকোণা']
};

window.fillDistricts = () => {
  const div = document.getElementById('r-division').value;
  const sel = document.getElementById('r-district');
  sel.innerHTML = '<option value="">জেলা *</option>';
  (DISTRICTS[div]||[]).forEach(d => sel.innerHTML += `<option>${d}</option>`);
};

window.toggleNever = () => {
  const cb = document.getElementById('never-check');
  cb.checked = !cb.checked;
  document.getElementById('date-row').style.display = cb.checked ? 'none' : 'flex';
};

window.toggleEye = id => {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
};
</script>

<script type="module">
import { auth, db } from './firebase-config.js';
import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const COORDS = {
  'ঢাকা':{lat:23.8103,lng:90.4125},'গাজীপুর':{lat:23.9999,lng:90.4203},
  'নারায়ণগঞ্জ':{lat:23.6238,lng:90.4997},'চট্টগ্রাম':{lat:22.3569,lng:91.7832},
  'কুমিল্লা':{lat:23.4682,lng:91.1788},'চাঁদপুর':{lat:23.2513,lng:90.8519},
  'সিলেট':{lat:24.8949,lng:91.8687},'রাজশাহী':{lat:24.3745,lng:88.6042},
  'খুলনা':{lat:22.8456,lng:89.5403},'বরিশাল':{lat:22.7010,lng:90.3535},
  'রংপুর':{lat:25.7439,lng:89.2752},'ময়মনসিংহ':{lat:24.7471,lng:90.4203},
  'কক্সবাজার':{lat:21.4272,lng:92.0058},'যশোর':{lat:23.1664,lng:89.2082},
  'বগুড়া':{lat:24.8481,lng:89.3720},'দিনাজপুর':{lat:25.6279,lng:88.6338},
  'ফরিদপুর':{lat:23.6070,lng:89.8429},'নোয়াখালী':{lat:22.8696,lng:91.0996},
  'কুষ্টিয়া':{lat:23.9010,lng:89.1202},'মৌলভীবাজার':{lat:24.4829,lng:91.7774}
};

window.register = async () => {
  const name     = document.getElementById('r-name').value.trim();
  const email    = document.getElementById('r-email').value.trim();
  const phone    = document.getElementById('r-phone').value.trim();
  const pass     = document.getElementById('r-pass').value;
  const blood    = document.getElementById('r-blood').value;
  const division = document.getElementById('r-division').value;
  const district = document.getElementById('r-district').value;
  const area     = document.getElementById('r-area').value.trim();
  const never    = document.getElementById('never-check').checked;
  const lastDate = never ? null : document.getElementById('r-lastdate').value;
  const urgent   = document.getElementById('r-urgent').checked;
  const btn      = document.getElementById('reg-btn');

  if (!name||!email||!phone||!pass||!blood||!division||!district) {
    showErr('সব * চিহ্নিত তথ্য পূরণ করুন'); return;
  }
  if (pass.length < 6) { showErr('পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে'); return; }

  btn.textContent = 'নিবন্ধন হচ্ছে...';
  btn.disabled = true;

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });

    const coords = COORDS[district] || COORDS[division] || {lat:23.8103,lng:90.4125};

    await setDoc(doc(db, 'users', cred.user.uid), {
      uid: cred.user.uid,
      name, email, phone, blood,
      division, district, area,
      lat: coords.lat + (Math.random()-.5)*.04,
      lng: coords.lng + (Math.random()-.5)*.04,
      lastDonation : lastDate || null,
      neverDonated : never,
      urgentReady  : urgent,
      available    : true,
      isDonor      : true,
      donations    : 0,
      rating       : 0,
      raters       : 0,
      createdAt    : serverTimestamp()
    });

    window.location.href = 'index.html';
  } catch(e) {
    showErr(errMsg(e.code));
    btn.textContent = '🩸 নিবন্ধন করুন';
    btn.disabled = false;
  }
};

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
  window.scrollTo(0,0);
}
function errMsg(code) {
  return {
    'auth/email-already-in-use':'এই ইমেইলে আগেই একাউন্ট আছে।',
    'auth/invalid-email':'সঠিক ইমেইল দিন।',
    'auth/weak-password':'পাসওয়ার্ড কমপক্ষে ৬ অক্ষর হতে হবে।'
  }[code] || 'কিছু একটা সমস্যা হয়েছে। আবার চেষ্টা করুন।';
}
</script>
</body>
</html>
