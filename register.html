<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeDrop — Donor নিবন্ধন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body{background:#f5f5f5;min-height:100vh}
.topbar{background:linear-gradient(135deg,#c0392b,#e74c3c);padding:13px 16px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.back{color:#fff;font-size:20px;text-decoration:none;background:rgba(255,255,255,.2);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.topbar h2{color:#fff;font-size:16px;font-weight:700;font-family:'Hind Siliguri',sans-serif}
.body{padding:14px;max-width:480px;margin:0 auto}
.error-msg{background:#fdecea;color:#c0392b;padding:11px 14px;border-radius:11px;font-size:13px;margin-bottom:14px;border-left:3px solid #c0392b;font-family:'Hind Siliguri',sans-serif;display:none}
.reg-section{background:#fff;border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 1px 5px rgba(0,0,0,.05)}
.reg-section-title{font-size:12px;font-weight:700;color:#c0392b;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid #fde;font-family:'Hind Siliguri',sans-serif}
.input-group{display:flex;align-items:center;background:#f8f8f8;border:1.5px solid #eee;border-radius:12px;padding:0 13px;margin-bottom:10px;transition:.2s}
.input-group:last-child{margin-bottom:0}
.input-group:focus-within{border-color:#c0392b;background:#fff}
.input-icon{font-size:15px;margin-right:10px;opacity:.6;flex-shrink:0}
.input-group input,.input-group select{flex:1;border:none;background:transparent;padding:12px 0;font-size:13px;outline:none;font-family:'Hind Siliguri',sans-serif;color:#222}
.eye-btn{background:none;border:none;cursor:pointer;font-size:14px;opacity:.4;padding:4px}
.loc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:10px}
.loc-grid .input-group{margin-bottom:0}
.date-label{font-size:11px;font-weight:700;color:#666;margin-bottom:6px;font-family:'Hind Siliguri',sans-serif;padding-left:2px}
.never-row{display:flex;align-items:center;gap:9px;margin-bottom:8px;cursor:pointer}
.never-row input[type=checkbox]{width:17px;height:17px;accent-color:#c0392b;cursor:pointer}
.never-row label{font-size:13px;color:#555;font-family:'Hind Siliguri',sans-serif;cursor:pointer}
.avail-toggle{display:flex;align-items:center;gap:12px}
.avail-toggle>div{flex:1}
.avail-t1{font-size:13px;font-weight:700;font-family:'Hind Siliguri',sans-serif}
.avail-t2{font-size:11px;color:#aaa;margin-top:2px;font-family:'Hind Siliguri',sans-serif}
.toggle-switch{position:relative;width:46px;height:26px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:#ddd;border-radius:26px;cursor:pointer;transition:.3s}
.toggle-slider:before{content:'';position:absolute;width:20px;height:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-switch input:checked+.toggle-slider{background:#c0392b}
.toggle-switch input:checked+.toggle-slider:before{transform:translateX(20px)}
.submit-btn{width:100%;padding:14px;background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;border:none;border-radius:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Hind Siliguri',sans-serif;margin-top:4px;box-shadow:0 4px 14px rgba(192,57,43,.3)}
.submit-btn:disabled{background:#e0a0a0;box-shadow:none;cursor:not-allowed}
.login-link{text-align:center;margin-top:14px;font-size:13px;color:#aaa;font-family:'Hind Siliguri',sans-serif}
.login-link a{color:#c0392b;font-weight:700;text-decoration:none}
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.85);z-index:9999;align-items:center;justify-content:center;flex-direction:column;gap:10px}
.loading-overlay.show{display:flex}
.spinner{width:38px;height:38px;border:4px solid #fde;border-top-color:#c0392b;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back">←</a>
  <h2>🩸 Donor হিসেবে নিবন্ধন</h2>
</div>

<div class="body">
  <div id="err" class="error-msg"></div>

  <!-- ব্যক্তিগত তথ্য -->
  <div class="reg-section">
    <div class="reg-section-title">👤 ব্যক্তিগত তথ্য</div>
    <div class="input-group"><span class="input-icon">👤</span><input type="text" id="r-name" placeholder="পূর্ণ নাম *"/></div>
    <div class="input-group"><span class="input-icon">✉️</span><input type="email" id="r-email" placeholder="ই-মেইল *"/></div>
    <div class="input-group"><span class="input-icon">📞</span><input type="tel" id="r-phone" placeholder="ফোন নম্বর *"/></div>
    <div class="input-group">
      <span class="input-icon">🔒</span>
      <input type="password" id="r-pass" placeholder="পাসওয়ার্ড * (কমপক্ষে ৬ অক্ষর)"/>
      <button class="eye-btn" onclick="toggleEye()">👁</button>
    </div>
  </div>

  <!-- রক্তের তথ্য -->
  <div class="reg-section">
    <div class="reg-section-title">🩸 রক্তের তথ্য</div>
    <div class="input-group">
      <span class="input-icon">🩸</span>
      <select id="r-blood">
        <option value="">রক্তের গ্রুপ বেছে নিন *</option>
        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
        <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
      </select>
    </div>
    <div class="date-label">সর্বশেষ রক্তদানের তারিখ</div>
    <div class="input-group" id="date-row">
      <span class="input-icon">📅</span>
      <input type="date" id="r-lastdate"/>
    </div>
    <div class="never-row">
      <input type="checkbox" id="never-check" onchange="toggleNever()"/>
      <label for="never-check">এখনো রক্ত দেইনি</label>
    </div>
  </div>

  <!-- অবস্থান -->
  <div class="reg-section">
    <div class="reg-section-title">📍 অবস্থান</div>
    <div class="loc-grid">
      <div class="input-group">
        <select id="r-division" onchange="fillDistricts()">
          <option value="">বিভাগ *</option>
          <option>ঢাকা</option><option>চট্টগ্রাম</option><option>খুলনা</option>
          <option>রাজশাহী</option><option>রংপুর</option><option>সিলেট</option>
          <option>বরিশাল</option><option>ময়মনসিংহ</option>
        </select>
      </div>
      <div class="input-group">
        <select id="r-district"><option value="">জেলা *</option></select>
      </div>
    </div>
    <div class="input-group">
      <span class="input-icon">🏘️</span>
      <input type="text" id="r-area" placeholder="এলাকা / থানা"/>
    </div>
  </div>

  <!-- জরুরি -->
  <div class="reg-section">
    <div class="avail-toggle">
      <div>
        <div class="avail-t1">⚡ জরুরি রক্তদানের জন্য প্রস্তুত</div>
        <div class="avail-t2">চালু থাকলে জরুরি অনুরোধে অগ্রাধিকার পাবেন</div>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="r-urgent" checked/>
        <span class="toggle-slider"></span>
      </label>
    </div>
  </div>

  <button class="submit-btn" id="reg-btn" onclick="registerDonor()">🩸 নিবন্ধন করুন</button>
  <p class="login-link">আগেই নিবন্ধিত? <a href="login.html">লগইন করুন</a></p>
</div>

<div id="loading" class="loading-overlay"><div class="spinner"></div></div>

<script>
const DISTRICTS = {
  'ঢাকা':['ঢাকা','গাজীপুর','নারায়ণগঞ্জ','মানিকগঞ্জ','মুন্সীগঞ্জ','নরসিংদী','ফরিদপুর','গোপালগঞ্জ','মাদারীপুর','রাজবাড়ী','শরীয়তপুর','কিশোরগঞ্জ','টাঙ্গাইল'],
  'চট্টগ্রাম':['চট্টগ্রাম','কক্সবাজার','কুমিল্লা','ফেনী','নোয়াখালী','লক্ষ্মীপুর','চাঁদপুর','ব্রাহ্মণবাড়িয়া','রাঙামাটি','খাগড়াছড়ি','বান্দরবান'],
  'খুলনা':['খুলনা','বাগেরহাট','সাতক্ষীরা','যশোর','নড়াইল','মাগুরা','ঝিনাইদহ','কুষ্টিয়া','মেহেরপুর','চুয়াডাঙ্গা'],
  'রাজশাহী':['রাজশাহী','নাটোর','নওগাঁ','চাঁপাইনবাবগঞ্জ','পাবনা','সিরাজগঞ্জ','বগুড়া','জয়পুরহাট'],
  'রংপুর':['রংপুর','গাইবান্ধা','কুড়িগ্রাম','লালমনিরহাট','নীলফামারী','ঠাকুরগাঁও','পঞ্চগড়','দিনাজপুর'],
  'সিলেট':['সিলেট','মৌলভীবাজার','হবিগঞ্জ','সুনামগঞ্জ'],
  'বরিশাল':['বরিশাল','ভোলা','পটুয়াখালী','পিরোজপুর','ঝালকাঠি','বরগুনা'],
  'ময়মনসিংহ':['ময়মনসিংহ','জামালপুর','শেরপুর','নেত্রকোণা']
};
window.fillDistricts = () => {
  const div = document.getElementById('r-division').value;
  const sel = document.getElementById('r-district');
  sel.innerHTML = '<option value="">জেলা *</option>';
  (DISTRICTS[div]||[]).forEach(d => sel.innerHTML += `<option>${d}</option>`);
};
window.toggleNever = () => {
  const cb = document.getElementById('never-check');
  document.getElementById('date-row').style.display = cb.checked ? 'none' : 'flex';
};
window.toggleEye = () => {
  const el = document.getElementById('r-pass');
  el.type = el.type === 'password' ? 'text' : 'password';
};
function setLoading(v){ document.getElementById('loading').classList.toggle('show',v); }
</script>

<script type="module">
import { auth, db } from './firebase-config.js';
import { createUserWithEmailAndPassword, updateProfile, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const COORDS = {
  'ঢাকা':{lat:23.8103,lng:90.4125},'গাজীপুর':{lat:23.9999,lng:90.4203},
  'নারায়ণগঞ্জ':{lat:23.6238,lng:90.4997},'চট্টগ্রাম':{lat:22.3569,lng:91.7832},
  'কুমিল্লা':{lat:23.4682,lng:91.1788},'সিলেট':{lat:24.8949,lng:91.8687},
  'রাজশাহী':{lat:24.3745,lng:88.6042},'খুলনা':{lat:22.8456,lng:89.5403},
  'বরিশাল':{lat:22.7010,lng:90.3535},'রংপুর':{lat:25.7439,lng:89.2752},
  'ময়মনসিংহ':{lat:24.7471,lng:90.4203},'বগুড়া':{lat:24.8481,lng:89.3720},
  'যশোর':{lat:23.1664,lng:89.2082},'দিনাজপুর':{lat:25.6279,lng:88.6338},
  'কক্সবাজার':{lat:21.4272,lng:92.0058},'ফরিদপুর':{lat:23.6070,lng:89.8429}
};

window.registerDonor = async () => {
  const name     = document.getElementById('r-name').value.trim();
  const email    = document.getElementById('r-email').value.trim();
  const phone    = document.getElementById('r-phone').value.trim();
  const pass     = document.getElementById('r-pass').value;
  const blood    = document.getElementById('r-blood').value;
  const division = document.getElementById('r-division').value;
  const district = document.getElementById('r-district').value;
  const area     = document.getElementById('r-area').value.trim();
  const never    = document.getElementById('never-check').checked;
  const lastDate = never ? null : document.getElementById('r-lastdate').value;
  const urgent   = document.getElementById('r-urgent').checked;
  const btn      = document.getElementById('reg-btn');

  if(!name||!email||!phone||!pass||!blood||!division||!district){
    showErr('সব * চিহ্নিত তথ্য পূরণ করুন'); return;
  }
  if(pass.length < 6){ showErr('পাসওয়ার্ড কমপক্ষে ৬ অক্ষর'); return; }

  btn.textContent = 'নিবন্ধন হচ্ছে...';
  btn.disabled = true;
  setLoading(true);

  try {
    // Step 1: Firebase Auth এ account তৈরি
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });

    const uid = cred.user.uid;
    const coords = COORDS[district] || COORDS[division] || {lat:23.8103,lng:90.4125};

    // Step 2: ✅ DONORS collection এ save — search এখান থেকে হবে
    await setDoc(doc(db, 'donors', uid), {
      uid, name, email, phone, blood,
      division, district, area,
      lat: coords.lat + (Math.random()-.5)*.04,
      lng: coords.lng + (Math.random()-.5)*.04,
      lastDonation : lastDate || null,
      neverDonated : never,
      urgentReady  : urgent,
      available    : true,
      isDonor      : true,
      photo        : '',
      donations    : 0,
      rating       : 0,
      raters       : 0,
      createdAt    : serverTimestamp()
    });

    // Step 3: ✅ USERS collection এ save — auth info
    await setDoc(doc(db, 'users', uid), {
      uid, name, email, phone,
      photo     : '',
      isDonor   : true,
      available : true,
      blood,
      donations : 0,
      rating    : 0,
      raters    : 0,
      createdAt : serverTimestamp()
    });

    window.location.href = 'index.html';

  } catch(e) {
    if(e.code === 'auth/email-already-in-use'){
      showErr('এই ইমেইলে আগেই একাউন্ট আছে। লগইন করুন।');
    } else {
      showErr('Error: ' + e.message);
    }
    btn.textContent = '🩸 নিবন্ধন করুন';
    btn.disabled = false;
  } finally {
    setLoading(false);
  }
};

function showErr(msg) {
  const el = document.getElementById('err');
  el.textContent = msg;
  el.style.display = 'block';
  window.scrollTo(0, 0);
}
</script>
</body>
</html>
