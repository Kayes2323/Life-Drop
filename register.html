<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeDrop — Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
<div class="auth-card">
  <div class="auth-logo">🩸 LifeDrop</div>
  <h2>Donor Registration</h2>
  <div id="auth-error" class="error-msg" style="display:none"></div>

  <div class="form-row">
    <div class="form-group">
      <label>Full Name *</label>
      <input type="text" id="name" placeholder="তোমার নাম"/>
    </div>
    <div class="form-group">
      <label>Blood Group *</label>
      <select id="blood">
        <option value="">Select</option>
        <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
        <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
      </select>
    </div>
  </div>

  <div class="form-group">
    <label>Phone *</label>
    <input type="tel" id="phone" placeholder="+8801..."/>
  </div>

  <div class="form-group">
    <label>Area *</label>
    <select id="area-pick" onchange="document.getElementById('address').value=this.value">
      <option value="">-- Select Area --</option>
      <option>Mohammadpur</option><option>Shyamoli</option><option>Adabor</option>
      <option>Lalmatia</option><option>Dhanmondi</option><option>Mirpur</option>
      <option>Gulshan</option><option>Banani</option><option>Uttara</option>
      <option>Motijheel</option><option>Rayer Bazar</option><option>Bosila</option>
      <option>Azimpur</option><option>Lalbagh</option><option>Old Dhaka</option>
      <option>Farmgate</option><option>Tejgaon</option><option>Badda</option>
      <option>Khilgaon</option><option>Demra</option>
    </select>
    <input type="text" id="address" placeholder="অথবা নিজে লিখো" style="margin-top:6px"/>
  </div>

  <div class="form-group">
    <label>WhatsApp Number (optional)</label>
    <input type="tel" id="wa" placeholder="+8801..."/>
  </div>

  <div class="form-group">
    <label>Email *</label>
    <input type="email" id="email" placeholder="your@email.com"/>
  </div>

  <div class="form-group">
    <label>Password * (min 6 characters)</label>
    <input type="password" id="password" placeholder="••••••••"/>
  </div>

  <button class="submit-btn" id="reg-btn" onclick="registerUser()">Create Donor Account</button>
  <p class="auth-switch">Already registered? <a href="login.html">Login</a></p>
</div>

<script type="module">
import { auth, db } from './firebase-config.js';
import { createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const AREA_COORDS = {
  'Mohammadpur' :{lat:23.7644,lng:90.3564},
  'Shyamoli'    :{lat:23.7710,lng:90.3610},
  'Adabor'      :{lat:23.7600,lng:90.3480},
  'Lalmatia'    :{lat:23.7692,lng:90.3680},
  'Dhanmondi'   :{lat:23.7461,lng:90.3742},
  'Mirpur'      :{lat:23.8223,lng:90.3654},
  'Gulshan'     :{lat:23.7808,lng:90.4142},
  'Banani'      :{lat:23.7937,lng:90.4066},
  'Uttara'      :{lat:23.8759,lng:90.3795},
  'Motijheel'   :{lat:23.7337,lng:90.4170},
  'Rayer Bazar' :{lat:23.7550,lng:90.3590},
  'Bosila'      :{lat:23.7620,lng:90.3420},
  'Azimpur'     :{lat:23.7247,lng:90.3892},
  'Lalbagh'     :{lat:23.7196,lng:90.3876},
  'Old Dhaka'   :{lat:23.7104,lng:90.4074},
  'Farmgate'    :{lat:23.7584,lng:90.3899},
  'Tejgaon'     :{lat:23.7677,lng:90.4045},
  'Badda'       :{lat:23.7797,lng:90.4278},
  'Khilgaon'    :{lat:23.7397,lng:90.4270},
  'Demra'       :{lat:23.7197,lng:90.4600}
};

window.registerUser = async () => {
  const name    = document.getElementById('name').value.trim();
  const blood   = document.getElementById('blood').value;
  const phone   = document.getElementById('phone').value.trim();
  const address = document.getElementById('address').value.trim();
  const email   = document.getElementById('email').value.trim();
  const pass    = document.getElementById('password').value;
  const wa      = document.getElementById('wa').value.trim();
  const btn     = document.getElementById('reg-btn');
  const errEl   = document.getElementById('auth-error');
  errEl.style.display = 'none';

  if (!name || !blood || !phone || !address || !email || !pass) {
    showErr('সব * field পূরণ করো'); return;
  }
  if (pass.length < 6) { showErr('Password কমপক্ষে 6 character হতে হবে'); return; }

  btn.textContent = 'Creating account...';
  btn.disabled = true;

  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    await updateProfile(cred.user, { displayName: name });

    const coords = AREA_COORDS[address] || {
      lat: 23.7644 + (Math.random() - .5) * .03,
      lng: 90.3564 + (Math.random() - .5) * .03
    };

    await setDoc(doc(db, 'donors', cred.user.uid), {
      uid       : cred.user.uid,
      name, blood, phone, address, email, wa,
      lat       : coords.lat,
      lng       : coords.lng,
      donations : 0,
      rating    : 0,
      raters    : 0,
      available : true,
      createdAt : serverTimestamp()
    });

    window.location.href = 'index.html';
  } catch(e) {
    showErr(friendlyError(e.code));
    btn.textContent = 'Create Donor Account';
    btn.disabled = false;
  }
};

function showErr(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.display = 'block';
}

function friendlyError(code) {
  const map = {
    'auth/email-already-in-use': 'এই email দিয়ে আগেই account আছে।',
    'auth/invalid-email'       : 'Valid email দাও।',
    'auth/weak-password'       : 'Password কমপক্ষে 6 character হতে হবে।'
  };
  return map[code] || 'কিছু একটা সমস্যা হয়েছে। আবার চেষ্টা করো।';
}
</script>
</body>
</html>
