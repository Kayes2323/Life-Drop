  ইউজারের email সরাসরি পাবলিক 'donors' কালেকশনে লিখে ফেলতো — যেটা
  donor.html-এর বর্তমান PII-মুক্ত ডিজাইনের সাথে সাংঘর্ষিক এবং একটা
  বাস্তব প্রাইভেসি লিক ছিল। কোথাও এই পেজের লিংক না থাকলেও (কোনো nav/বাটন
  এটাকে পয়েন্ট করে না) সরাসরি URL দিয়ে এখনো পাওয়া যেতো এবং service
  worker এটা cache করে রাখতো। তাই পুরনো ফর্ম বাদ দিয়ে এখন এটা শুধু
  বর্তমান, নিরাপদ donor.html রেজিস্ট্রেশন ফ্লো-তে রিডাইরেক্ট করে —
  পুরনো বুকমার্ক/লিংক ভাঙে না, আর leak-ও বন্ধ হয়ে যায়।
-->
