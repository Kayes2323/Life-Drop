<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="sondhan-logo.png"/>
<title>Sondhan — লগইন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="style.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Hind Siliguri',sans-serif;background:#c0392b;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.hero{text-align:center;padding:44px 20px 24px;color:#fff;width:100%;display:flex;flex-direction:column;align-items:center}
.hero .sondhan-logo{margin-bottom:10px}
.hero p{font-size:13px;margin-top:6px;opacity:.88;font-family:'Inter',sans-serif}
.brand-tagline{font-family:'Hind Siliguri',sans-serif;font-weight:400;color:#6B7280;font-size:12px}
.card{background:#fff;border-radius:28px 28px 0 0;width:100%;max-width:480px;flex:1;padding:26px 22px 40px;overflow-y:auto}
.err{background:#fdecea;color:#c0392b;padding:11px 14px;border-radius:11px;font-size:13px;margin-bottom:14px;border-left:3px solid #c0392b;display:none;font-family:'Hind Siliguri',sans-serif}

/* TABS */
.login-tabs{display:flex;background:#f5f5f5;border-radius:14px;padding:4px;margin-bottom:20px;gap:3px}
.login-tab{flex:1;padding:9px 4px;border:none;background:transparent;border-radius:11px;font-size:12px;font-weight:600;color:#aaa;cursor:pointer;font-family:'Hind Siliguri',sans-serif;transition:.2s}
.login-tab.active{background:#c0392b;color:#fff;box-shadow:0 2px 8px rgba(192,57,43,.3)}

/* INPUTS */
.iw{display:flex;align-items:center;background:#f8f8f8;border:1.5px solid #eee;border-radius:13px;padding:0 14px;margin-bottom:12px;transition:.2s}
.iw:focus-within{border-color:#c0392b;background:#fff}
.ico{font-size:16px;margin-right:10px;opacity:.6}
.iw input{flex:1;border:none;background:transparent;padding:14px 0;font-size:15px;color:#222;outline:none;font-family:'Hind Siliguri',sans-serif}
.eye{background:none;border:none;cursor:pointer;font-size:16px;opacity:.4;padding:4px}

/* BUTTONS */
.submit-btn{width:100%;padding:15px;background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Hind Siliguri',sans-serif;transition:.15s;margin-top:2px}
.submit-btn:disabled{background:#e0a0a0;cursor:not-allowed}
.google-btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;padding:14px;background:#fff;border:1.5px solid #eee;border-radius:13px;font-size:14px;font-weight:700;color:#333;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.07);margin-bottom:14px;font-family:'Inter',sans-serif;transition:.15s}
.google-btn:disabled{opacity:.6;cursor:not-allowed}
.divider{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.divider hr{flex:1;border:none;border-top:1px solid #eee}
.divider span{font-size:11px;color:#ccc}

/* OTP */
.otp-sent{background:#d1f3e0;border:1px solid #c3e6cb;border-radius:11px;padding:10px 14px;font-size:12px;color:#155724;font-family:'Hind Siliguri',sans-serif;margin-bottom:12px;display:none}

/* REGISTER BOX */
.reg-box{margin-top:18px;background:#fafafa;border:1.5px solid #f0f0f0;border-radius:14px;padding:14px;text-align:center}
.reg-box p{font-size:13px;color:#444;font-weight:700;font-family:'Hind Siliguri',sans-serif;margin-bottom:10px}
.reg-link{display:block;padding:11px;background:#fff;color:#c0392b;border:1.5px solid #c0392b;border-radius:11px;font-size:13px;font-weight:700;text-decoration:none;font-family:'Hind Siliguri',sans-serif}

#recaptcha-container{margin-bottom:10px}
</style>
</head>
<body>

<div class="hero">
  <div class="sondhan-logo sondhan-logo--navbar-crop">
    <img src="sondhan-logo.png" alt="Sondhan" decoding="async" fetchpriority="high"/>
  </div>
  <p class="brand-tagline">রক্তের সন্ধানে</p>
</div>

<div class="card">
  <div id="err" class="err"></div>

  <!-- TABS -->
  <div class="login-tabs">
    <button class="login-tab active" id="t-google">Google</button>
    <button class="login-tab" id="t-email">ইমেইল</button>
    <button class="login-tab" id="t-phone">ফোন</button>
  </div>

  <!-- GOOGLE TAB -->
  <div id="tab-google">
    <button class="google-btn" id="g-btn">
      <svg width="22" height="22" viewBox="0 0 24 24">
        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Google দিয়ে লগইন / Sign Up
    </button>
    <p style="text-align:center;font-size:12px;color:#aaa;font-family:'Hind Siliguri',sans-serif;line-height:1.6">Google account থাকলে একটি tap এই লগইন করুন।<br>নতুন হলেও Google দিয়ে sign up করা যাবে।</p>
  </div>

  <!-- EMAIL TAB -->
  <div id="tab-email" style="display:none">
    <div class="iw">
      <span class="ico">✉️</span>
      <input type="email" id="email" placeholder="ই-মেইল ঠিকানা"/>
    </div>
    <div class="iw">
      <span class="ico">🔒</span>
      <input type="password" id="pass" placeholder="পাসওয়ার্ড"/>
      <button class="eye" id="eye-btn">👁</button>
    </div>
    <button class="submit-btn" id="e-btn">→ লগইন করুন</button>
  </div>

  <!-- PHONE TAB -->
  <div id="tab-phone" style="display:none">
    <div id="otp-sent-msg" class="otp-sent">✅ OTP পাঠানো হয়েছে। নিচে কোড দিন।</div>

    <!-- Step 1: phone input -->
    <div id="phone-step1">
      <div class="iw">
        <span class="ico">📞</span>
        <input type="tel" id="phone-num" placeholder="+8801XXXXXXXXX"/>
      </div>
      <div id="recaptcha-container"></div>
      <button class="submit-btn" id="otp-send-btn">OTP পাঠান</button>
    </div>

    <!-- Step 2: OTP input -->
    <div id="phone-step2" style="display:none">
      <div class="iw">
        <span class="ico">🔢</span>
        <input type="number" id="otp-code" placeholder="6 সংখ্যার OTP কোড"/>
      </div>
      <button class="submit-btn" id="otp-verify-btn">✅ যাচাই করুন</button>
      <button id="retry-phone-btn" style="width:100%;margin-top:10px;padding:10px;background:none;border:none;color:#aaa;font-size:13px;cursor:pointer;font-family:'Hind Siliguri',sans-serif">← আবার চেষ্টা করুন</button>
    </div>
  </div>

  <!-- REGISTER LINK -->
  <div class="reg-box">
    <p>নতুন ব্যবহারকারী?</p>
    <a href="signup.html" class="reg-link">Sign Up করুন</a>
  </div>
</div>

<script type="module">
import { auth, db } from './firebase-config.js';
import {
  onAuthStateChanged,
  signInWithEmailAndPassword,
  signInWithPopup, GoogleAuthProvider,
  signInWithPhoneNumber, RecaptchaVerifier
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const redir = new URLSearchParams(window.location.search).get('redirect') || 'index.html';

let confirmationResult = null;
let recaptchaVerifier  = null;

// Already logged in
onAuthStateChanged(auth, u => {
  if(u) window.location.replace(redir);
});

// TAB SWITCH
function switchTab(tab) {
  ['google','email','phone'].forEach(t => {
    document.getElementById('tab-'+t).style.display = t===tab ? 'block':'none';
    document.getElementById('t-'+t).classList.toggle('active', t===tab);
  });
  hideErr();
  if(tab==='phone'){
    document.getElementById('phone-step1').style.display = 'block';
    document.getElementById('phone-step2').style.display = 'none';
    document.getElementById('otp-sent-msg').style.display = 'none';
    destroyRecaptcha();
  }
}

// GOOGLE
async function loginGoogle() {
  const btn = document.getElementById('g-btn');
  btn.disabled=true; btn.textContent='অপেক্ষা করুন...';
  hideErr();
  try {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({prompt:'select_account'});
    const res = await signInWithPopup(auth, provider);
    const u = res.user;
    const ref = doc(db,'users',u.uid);
    const snap = await getDoc(ref);
    if(!snap.exists()){
      await setDoc(ref,{
        uid:u.uid, name:u.displayName||'',
        email:u.email, photo:u.photoURL||'',
        isDonor:false, available:false,
        donations:0, rating:0, raters:0,
        createdAt:serverTimestamp()
      });
    }
    window.location.replace(redir);
  } catch(e){
    if(e.code!=='auth/popup-closed-by-user') showErr('Google লগইন ব্যর্থ। আবার চেষ্টা করুন।');
    btn.innerHTML=`<svg width="22" height="22" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg> Google দিয়ে লগইন / Sign Up`;
    btn.disabled=false;
  }
};

// EMAIL
async function loginEmail() {
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('pass').value;
  const btn   = document.getElementById('e-btn');
  hideErr();
  if(!email){ showErr('ইমেইল দিন'); return; }
  if(!pass) { showErr('পাসওয়ার্ড দিন'); return; }
  btn.textContent='অপেক্ষা করুন...'; btn.disabled=true;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    window.location.replace(redir);
  } catch(e){
    showErr(errMsg(e.code));
    btn.textContent='→ লগইন করুন'; btn.disabled=false;
  }
};

// PHONE OTP — Firebase SMS + reCAPTCHA; tear down verifier on failures so retries work.
function destroyRecaptcha(){
  try {
    recaptchaVerifier?.clear?.();
  } catch(_) {}
  recaptchaVerifier = null;
  const el = document.getElementById('recaptcha-container');
  if (el) el.innerHTML = '';
}

/** Accepts +880..., 880..., 01..., 1... (Bangladesh mobile) → E.164 +8801XXXXXXXXX */
function normalizeBdPhone(raw){
  let d = String(raw || '').replace(/\s+/g, '');
  if (!d) return '';
  if (d.startsWith('+')) d = d.slice(1);
  if (d.startsWith('880')) d = d.slice(3);
  if (d.startsWith('0')) d = d.slice(1);
  if (d.startsWith('1') && d.length === 10) return '+880' + d;
  if (/^\d{10,11}$/.test(d)) return '+880' + (d.startsWith('1') ? d : '');
  return '+' + raw.replace(/\s+/g,'').replace(/^\+/, '');
}

/** @returns {boolean} */
function initRecaptcha(silent){
  destroyRecaptcha();
  try {
    recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
      size:'invisible',
      callback: () => {}
    });
    recaptchaVerifier.render().catch(() => {});
    return true;
  } catch(e){
    if(!silent){
      showErr('যাচাইকরণ লোড করা যায়নি। পেজ রিফ্রেশ করে আবার চেষ্টা করুন।');
    }
    return false;
  }
}

async function sendOTP() {
  const raw = document.getElementById('phone-num').value.trim();
  const btn   = document.getElementById('otp-send-btn');
  hideErr();

  let phone = raw.replace(/\s+/g, '').trim();
  if (!phone){ showErr('ফোন নম্বর দিন'); return; }
  if (!phone.startsWith('+')) phone = normalizeBdPhone(phone);
  if (!/^\+8801\d{9}$/.test(phone)){
    showErr('মোবাইল নম্বর সঠিক দিন: 01XXXXXXXXX বা +8801XXXXXXXXX'); return;
  }

  btn.textContent='OTP পাঠানো হচ্ছে...'; btn.disabled=true;

  try {
    // Fresh verifier every time — avoids "already rendered" error
    destroyRecaptcha();
    recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', {
      size: 'invisible',
      callback: () => {}
    });
    await recaptchaVerifier.render();
    confirmationResult = await signInWithPhoneNumber(auth, phone, recaptchaVerifier);
    document.getElementById('phone-num').value = phone;
    document.getElementById('phone-step1').style.display='none';
    document.getElementById('phone-step2').style.display='block';
    document.getElementById('otp-sent-msg').style.display='block';
  } catch(e){
    const code = e?.code || '';
    const msg = phoneErrMsg(code) || ('OTP পাঠানো যায়নি: ' + (e?.message || String(e)));
    showErr(msg);
    destroyRecaptcha();
    btn.textContent='OTP পাঠান'; btn.disabled=false;
  }
};

async function verifyOTP() {
  const code = document.getElementById('otp-code').value.trim();
  const btn  = document.getElementById('otp-verify-btn');
  hideErr();
  if(!code||code.length<6){ showErr('6 সংখ্যার OTP কোড দিন'); return; }
  btn.textContent='যাচাই হচ্ছে...'; btn.disabled=true;
  try {
    const res = await confirmationResult.confirm(code);
    const u = res.user;
    const ref = doc(db,'users',u.uid);
    const snap = await getDoc(ref);
    if(!snap.exists()){
      await setDoc(ref,{
        uid:u.uid, name:u.displayName||u.phoneNumber||'',
        email:'', photo:'', phone:u.phoneNumber||'',
        isDonor:false, available:false,
        donations:0, rating:0, raters:0,
        createdAt:serverTimestamp()
      });
    }
    window.location.replace(redir);
  } catch(e){
    showErr('OTP ভুল বা মেয়াদ শেষ।');
    btn.textContent='✅ যাচাই করুন'; btn.disabled=false;
  }
};

function toggleEye() {
  const el=document.getElementById('pass');
  el.type=el.type==='password'?'text':'password';
};

function showErr(m){ const e=document.getElementById('err'); e.textContent=m; e.style.display='block'; }
function hideErr(){ document.getElementById('err').style.display='none'; }
function errMsg(c){
  return {
    'auth/invalid-credential':'ইমেইল বা পাসওয়ার্ড ভুল।',
    'auth/user-not-found':'এই ইমেইলে কোনো একাউন্ট নেই।',
    'auth/wrong-password':'পাসওয়ার্ড ভুল।',
    'auth/invalid-email':'সঠিক ইমেইল দিন।',
    'auth/too-many-requests':'অনেকবার চেষ্টা হয়েছে। কিছুক্ষণ পরে আবার চেষ্টা করুন।',
    'auth/network-request-failed':'ইন্টারনেট সংযোগ চেক করুন।'
  }[c]||'সমস্যা হয়েছে: '+c;
}

function phoneErrMsg(c){
  return {
    'auth/invalid-phone-number':'ফোন নম্বরের ফরম্যাট ভুল। +8801XXXXXXXXX দিন।',
    'auth/missing-phone-number':'ফোন নম্বর দিন।',
    'auth/captcha-check-failed':'যাচাইকরণ (reCAPTCHA) ব্যর্থ। পেজ রিফ্রেশ করে আবার চেষ্টা করুন।',
    'auth/quota-exceeded':'SMS কোটা শেষ। Firebase Console / বিলিং চেক করুন।',
    'auth/too-many-requests':'একই নম্বরে অনেকবার চেষ্টা। কিছুক্ষণ পরে আবার চেষ্টা করুন।',
    'auth/missing-app-credential':'Firebase ফোন লগইন এই ব্রাউজার/ডোমেইনে সেটআপ নেই। Authorized domains চেক করুন।',
    'auth/invalid-app-credential':'অ্যাপ কনফিগ/SHA বা ডোমেইন মিলছে না। Firebase Authentication সেটিং দেখুন।',
    'auth/operation-not-allowed':'Firebase Console এ Phone sign-in চালু করুন।',
    'auth/network-request-failed':'ইন্টারনেট সংযোগ চেক করুন।'
  }[c] || '';
}

document.addEventListener('keydown', e => {
  if(e.key==='Enter') {
    const active = document.querySelector('.login-tab.active')?.id;
    if(active==='t-email') loginEmail();
  }
});

// Attach event listeners
document.getElementById('t-google').addEventListener('click', () => switchTab('google'));
document.getElementById('t-email').addEventListener('click', () => switchTab('email'));
document.getElementById('t-phone').addEventListener('click', () => switchTab('phone'));
document.getElementById('g-btn').addEventListener('click', loginGoogle);
document.getElementById('e-btn').addEventListener('click', loginEmail);
document.getElementById('eye-btn').addEventListener('click', toggleEye);
document.getElementById('otp-send-btn').addEventListener('click', sendOTP);
document.getElementById('otp-verify-btn').addEventListener('click', verifyOTP);
document.getElementById('retry-phone-btn').addEventListener('click', () => switchTab('phone'));
</script>
</body>
</html>
