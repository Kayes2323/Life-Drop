<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="icon" type="image/png" href="sondhan-logo.png"/>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#0f766e"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>রোগ সম্পর্কে জানুন — Sondhan Health</title>
<meta name="description" content="রোগের লক্ষণ, কারণ, প্রতিরোধ ও করণীয় সম্পর্কে নির্ভরযোগ্য তথ্য জানুন — ডেঙ্গু, ডায়াবেটিস, উচ্চ রক্তচাপসহ ২৬টি সাধারণ ও গুরুত্বপূর্ণ রোগ নিয়ে সহজ বাংলায় সাজানো স্বাস্থ্য-তথ্যভাণ্ডার।">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://www.sondhan.org/diseases.html"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Hind Siliguri',sans-serif;background:#f5f5f5;min-height:100vh;display:flex;flex-direction:column;max-width:480px;margin:0 auto}
.header{background:linear-gradient(135deg,#0f766e,#14b8a6);padding:12px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;position:sticky;top:0;z-index:260}
.back{color:#fff;font-size:18px;text-decoration:none;background:rgba(255,255,255,.2);width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.back:focus-visible{outline:2px solid #fff;outline-offset:2px}
.header h1{color:#fff;font-size:15px;font-weight:800;font-family:'Hind Siliguri',sans-serif}
.scr{flex:1;padding:14px;display:flex;flex-direction:column;gap:12px;font-family:'Hind Siliguri',sans-serif;padding-bottom:32px}

.intro{background:#fff;border-radius:16px;padding:16px;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.intro h2{font-size:16px;color:#222;margin-bottom:6px}
.intro p{font-size:12.5px;color:#777;line-height:1.75}

.search-box{display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:10px 14px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.search-box input{flex:1;border:0;outline:0;font-family:inherit;font-size:13.5px;background:transparent;min-width:0}
.search-box input:focus-visible{outline:2px solid #0f766e;outline-offset:2px;border-radius:6px}
.search-box button{border:0;background:#f0f0f0;color:#777;width:24px;height:24px;border-radius:50%;font-size:12px;cursor:pointer;flex-shrink:0}
.search-box button:focus-visible{outline:2px solid #0f766e;outline-offset:2px}

#cat-filters{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px}
.fchip{flex-shrink:0;border:1.5px solid #cdeae5;background:#fff;color:#0f766e;border-radius:20px;padding:7px 13px;font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.fchip.active{background:#0f766e;color:#fff;border-color:#0f766e}
.fchip:focus-visible{outline:2px solid #0f766e;outline-offset:2px}
#count{font-size:11.5px;color:#999}

#dz-list{display:flex;flex-direction:column;gap:10px}
.dz-card{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:0;border-radius:14px;padding:14px;box-shadow:0 1px 8px rgba(0,0,0,.06);cursor:pointer;text-decoration:none;color:inherit}
.dz-card:focus-visible{outline:2px solid #0f766e;outline-offset:2px}
.dz-card:active{transform:scale(.99)}
.dz-card-main{flex:1;min-width:0}
.dz-name{font-size:14.5px;font-weight:700;color:#222;line-height:1.4}
.dz-name-en{font-size:11px;color:#0f766e;font-weight:600;margin-top:1px}
.dz-summary{font-size:12px;color:#777;margin-top:5px;line-height:1.7}
.dz-cat-badge{display:inline-block;margin-top:7px;font-size:10px;font-weight:700;background:#e6f7f4;color:#0f766e;padding:3px 9px;border-radius:999px}
.dz-arrow{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:3px;color:#bbb}
.dz-arrow span{font-size:9px;white-space:nowrap}
.dz-arrow svg{width:18px;height:18px}

#empty-state{text-align:center;padding:30px 18px;color:#777}
#empty-state button{margin-top:12px;min-height:40px;padding:0 20px;border-radius:11px;background:#0f766e;color:#fff;border:0;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer}
#empty-state button:focus-visible{outline:2px solid #0f766e;outline-offset:3px}
[hidden]{display:none!important}
</style>
</head>
<body>

<div class="header">
  <a href="health.html" class="back" aria-label="হেলথ-এ ফিরুন">←</a>
  <div class="sondhan-logo sondhan-logo--navbar-crop"><img src="sondhan-logo.png" alt="Sondhan" decoding="async"/></div>
  <h1>রোগ সম্পর্কে জানুন</h1>
</div>

<div class="scr">
  <div class="intro">
    <h2>রোগ সম্পর্কে জানুন</h2>
    <p>রোগের লক্ষণ, কারণ, প্রতিরোধ ও করণীয় সম্পর্কে নির্ভরযোগ্য তথ্য জানুন। এটা রোগ নির্ণয় (diagnosis) না, সাধারণ স্বাস্থ্যশিক্ষা — লক্ষণ থাকলে চিকিৎসকের পরামর্শ নিন।</p>
  </div>

  <label class="search-box" for="search-inp">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
    <input id="search-inp" type="search" placeholder="রোগের নাম লিখে খুঁজুন"/>
    <button id="clear-search" type="button" hidden aria-label="সার্চ মুছুন">✕</button>
  </label>

  <div id="cat-filters" role="group" aria-label="রোগের ক্যাটাগরি"></div>
  <div id="count" aria-live="polite"></div>
  <div id="dz-list"></div>

  <div id="empty-state" hidden>
    <h3>এই নামে কোনো রোগ পাওয়া যায়নি</h3>
    <p>ভিন্ন বানান দিয়ে চেষ্টা করুন, অথবা ক্যাটাগরি বদলে দেখুন।</p>
    <button id="empty-clear" type="button">সার্চ মুছুন</button>
  </div>
</div>

<script type="module" src="diseases.js?v=2"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function (e) { console.warn('SW register failed:', e); }); });
}
</script>
</body>
</html>
