<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeDrop — জরুরি অনুরোধ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-left">
      <a href="index.html" style="color:#fff;font-size:20px;text-decoration:none;background:rgba(255,255,255,.2);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0">←</a>
      <span class="logo-drop">🆘</span>
      <h1>জরুরি রক্তের অনুরোধ</h1>
    </div>
  </div>

  <!-- TABS -->
  <div class="page-tabs">
    <button class="page-tab active" id="tab-new" onclick="switchTab('new')">➕ নতুন অনুরোধ</button>
    <button class="page-tab" id="tab-all" onclick="switchTab('all')">📋 সকল অনুরোধ</button>
  </div>

  <!-- NEW REQUEST FORM -->
  <div class="scr" id="view-new">

    <!-- ALERT BANNER -->
    <div class="alert-banner">
      <div class="alert-icon">🆘</div>
      <div class="alert-text">
        <h3>জরুরি রক্তের প্রয়োজন?</h3>
        <p>নিচের ফর্মটি পূরণ করুন — সবাই দেখতে পাবেন</p>
      </div>
    </div>

    <!-- CARD 1: রোগীর তথ্য -->
    <div class="fcard">
      <div class="fcard-title">👤 রোগীর তথ্য</div>
      <div class="iw"><span class="ico">👤</span><input type="text" id="f-pname" placeholder="রোগীর নাম *"/></div>
      <div class="iw"><span class="ico">🏥</span><input type="text" id="f-prob" placeholder="কী সমস্যা? (যেমন: অপারেশন) *"/></div>
      <div class="iw-grid">
        <div class="iw">
          <select id="f-blood" style="flex:1;border:none;background:transparent;padding:11px 0;font-size:13px;color:#222;outline:none;font-family:'Hind Siliguri',sans-serif">
            <option value="">রক্তের গ্রুপ *</option>
            <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
            <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
          </select>
        </div>
        <div class="iw"><span class="ico">🩸</span><input type="number" id="f-bags" placeholder="কয় ব্যাগ *" min="1" max="20"/></div>
      </div>
    </div>

    <!-- CARD 2: স্থান ও সময় -->
    <div class="fcard">
      <div class="fcard-title">📍 স্থান ও সময়</div>
      <div style="font-size:11px;font-weight:700;color:#888;margin-bottom:6px;font-family:'Hind Siliguri',sans-serif">কখন লাগবে? *</div>
      <div class="iw" style="margin-bottom:11px"><span class="ico">📅</span><input type="datetime-local" id="f-when"/></div>
      <div class="iw"><span class="ico">🏥</span><input type="text" id="f-hospital" placeholder="হাসপাতালের নাম ও এলাকা *"/></div>
      <div class="iw"><span class="ico">📝</span><input type="text" id="f-details" placeholder="বিস্তারিত (ঐচ্ছিক)"/></div>
    </div>

    <!-- CARD 3: যোগাযোগ -->
    <div class="fcard">
      <div class="fcard-title">📞 যোগাযোগ</div>
      <div class="iw"><span class="ico">👤</span><input type="text" id="f-cname" placeholder="আপনার নাম *"/></div>
      <div class="iw"><span class="ico">📞</span><input type="tel" id="f-cphone" placeholder="আপনার ফোন নম্বর *"/></div>
    </div>

    <button class="submit-btn" id="submit-btn" onclick="submitRequest()" style="margin-bottom:16px">
      🆘 অনুরোধ পাঠান
    </button>
  </div>

  <!-- ALL REQUESTS FEED -->
  <div class="scr" id="view-all" style="display:none">
    <div id="posts-list">
      <div class="hint-box"><div style="font-size:36px">🔄</div><p>লোড হচ্ছে...</p></div>
    </div>
  </div>

  <!-- BOTTOM NAV -->
  <div class="bnav">
    <button class="bnav-item" onclick="window.location.href='index.html'">
      <span class="bi">🏠</span><span class="bl">হোম</span>
    </button>
    <button class="bnav-item" onclick="window.location.href='search.html'">
      <span class="bi">🔍</span><span class="bl">খুঁজুন</span>
    </button>
    <button class="bnav-center active">
      <div class="bc-btn">🆘</div>
      <span class="bl">অনুরোধ</span>
    </button>
    <button class="bnav-item" onclick="window.location.href='about.html'">
      <span class="bi">ℹ️</span><span class="bl">About</span>
    </button>
    <button class="bnav-item" onclick="window.location.href='profile.html'">
      <span class="bi">👤</span><span class="bl">Profile</span>
    </button>
  </div>

</div>

<div class="toast" id="toast"></div>
<div id="loading" class="loading-overlay">
  <div class="spinner"></div>
  <p style="color:#c0392b;font-weight:600;font-size:13px;font-family:'Hind Siliguri',sans-serif">লোড হচ্ছে...</p>
</div>

<style>
/* PAGE TABS */
.page-tabs{display:flex;background:#fff;border-bottom:2px solid #f0f0f0;flex-shrink:0}
.page-tab{flex:1;padding:11px 4px;border:none;background:transparent;font-size:12px;font-weight:600;color:#bbb;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:'Hind Siliguri',sans-serif;transition:.2s}
.page-tab.active{color:#c0392b;border-bottom-color:#c0392b}

/* ALERT BANNER */
.alert-banner{background:linear-gradient(135deg,#c0392b,#e74c3c);border-radius:14px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.alert-icon{font-size:30px;flex-shrink:0}
.alert-text h3{color:#fff;font-size:14px;font-weight:700;font-family:'Hind Siliguri',sans-serif;margin-bottom:3px}
.alert-text p{color:rgba(255,255,255,.85);font-size:11px;font-family:'Hind Siliguri',sans-serif;line-height:1.5}

/* FORM CARDS */
.fcard{background:#fff;border-radius:14px;padding:14px;margin-bottom:11px;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.fcard-title{font-size:12px;font-weight:700;color:#c0392b;margin-bottom:12px;padding-bottom:9px;border-bottom:1px solid #fde;font-family:'Hind Siliguri',sans-serif}
.iw{display:flex;align-items:center;background:#f8f8f8;border:1.5px solid #eee;border-radius:11px;padding:0 12px;margin-bottom:10px;transition:.2s}
.iw:last-child{margin-bottom:0}
.iw:focus-within{border-color:#c0392b;background:#fff}
.ico{font-size:14px;margin-right:9px;opacity:.6;flex-shrink:0}
.iw input,.iw select{flex:1;border:none;background:transparent;padding:12px 0;font-size:13px;color:#222;outline:none;font-family:'Hind Siliguri',sans-serif}
.iw-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.iw-grid .iw{margin-bottom:0}

/* POST CARDS */
.req-post{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 1px 6px rgba(0,0,0,.06);border-left:4px solid #c0392b}
.req-post-top{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.rp-blood{color:#fff;font-size:13px;font-weight:800;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-family:'Inter',sans-serif}
.rp-info{flex:1;min-width:0}
.rp-info h4{font-size:13px;font-weight:700;font-family:'Hind Siliguri',sans-serif;margin-bottom:2px}
.rp-info p{font-size:10px;color:#aaa;font-family:'Hind Siliguri',sans-serif}
.rp-tag{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;background:#fdecea;color:#c0392b;font-family:'Inter',sans-serif;white-space:nowrap}
.rp-details{font-size:12px;color:#555;font-family:'Hind Siliguri',sans-serif;line-height:1.7;background:#fafafa;border-radius:10px;padding:9px;margin-bottom:9px}
.rp-footer{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.time-ago{font-size:10px;color:#bbb;font-family:'Inter',sans-serif}
.rp-actions{display:flex;gap:7px}
.rp-btn{flex:1;padding:8px;border-radius:9px;border:none;font-size:12px;font-weight:700;cursor:pointer;font-family:'Hind Siliguri',sans-serif;display:flex;align-items:center;justify-content:center;gap:4px;text-decoration:none}
.rp-btn.call{background:#27ae60;color:#fff}
.rp-btn.share{background:#f0f0f0;color:#555}

.scr{flex:1;overflow-y:auto;padding:12px}
</style>

<script>
// TAB SWITCH
window.switchTab = (tab) => {
  document.getElementById('view-new').style.display = tab==='new'?'flex':'none';
  document.getElementById('view-all').style.display = tab==='all'?'flex':'none';
  document.getElementById('tab-new').classList.toggle('active', tab==='new');
  document.getElementById('tab-all').classList.toggle('active', tab==='all');
  if(tab==='all') loadPosts();
};

// BLOOD GROUP COLOR
function bloodColor(b){
  const c={'A+':'#c0392b','A-':'#e74c3c','B+':'#e67e22','B-':'#d35400',
            'AB+':'#8e44ad','AB-':'#6c3483','O+':'#2980b9','O-':'#1a5276'};
  return c[b]||'#c0392b';
}

// TIME AGO
function timeAgo(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  const diff = Math.floor((Date.now()-d)/1000);
  if(diff<60) return 'এইমাত্র';
  if(diff<3600) return Math.floor(diff/60)+' মিনিট আগে';
  if(diff<86400) return Math.floor(diff/3600)+' ঘণ্টা আগে';
  return Math.floor(diff/86400)+' দিন আগে';
}

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2700);
}
function setLoading(v){ document.getElementById('loading').classList.toggle('show',v); }
</script>

<script type="module">
import { db } from './firebase-config.js';
import {
  collection, addDoc, onSnapshot,
  serverTimestamp, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// SUBMIT REQUEST
window.submitRequest = async () => {
  const pname    = document.getElementById('f-pname').value.trim();
  const prob     = document.getElementById('f-prob').value.trim();
  const blood    = document.getElementById('f-blood').value;
  const bags     = document.getElementById('f-bags').value;
  const when     = document.getElementById('f-when').value;
  const hospital = document.getElementById('f-hospital').value.trim();
  const details  = document.getElementById('f-details').value.trim();
  const cname    = document.getElementById('f-cname').value.trim();
  const cphone   = document.getElementById('f-cphone').value.trim();

  if(!pname||!prob||!blood||!bags||!when||!hospital||!cname||!cphone){
    showToast('সব * চিহ্নিত তথ্য পূরণ করুন'); return;
  }

  const btn = document.getElementById('submit-btn');
  btn.textContent='পাঠানো হচ্ছে...'; btn.disabled=true;

  try {
    await addDoc(collection(db,'bloodRequests'),{
      patientName : pname,
      problem     : prob,
      blood, bags : parseInt(bags),
      when, hospital, details,
      contactName : cname,
      contactPhone: cphone,
      status      : 'active',
      createdAt   : serverTimestamp()
    });

    // clear form
    ['f-pname','f-prob','f-bags','f-when','f-hospital','f-details','f-cname','f-cphone']
      .forEach(id => document.getElementById(id).value='');
    document.getElementById('f-blood').value='';

    showToast('✅ অনুরোধ পাঠানো হয়েছে! সবাই দেখতে পাবেন।');
    setTimeout(()=> switchTab('all'), 1500);

  } catch(e){
    showToast('Error: '+e.message);
  } finally {
    btn.textContent='🆘 অনুরোধ পাঠান';
    btn.disabled=false;
  }
};

// LOAD POSTS — real-time
window.loadPosts = () => {
  const el = document.getElementById('posts-list');
  el.innerHTML='<div class="hint-box"><div style="font-size:36px">🔄</div><p>লোড হচ্ছে...</p></div>';

  const q = query(collection(db,'bloodRequests'), orderBy('createdAt','desc'));
  onSnapshot(q, snap => {
    if(snap.empty){
      el.innerHTML='<div class="hint-box"><div style="font-size:36px">📋</div><p>এখনো কোনো অনুরোধ নেই।</p></div>';
      return;
    }
    el.innerHTML = snap.docs.map(d => {
      const r = d.data();
      const color = bloodColor(r.blood);
      return `
      <div class="req-post" style="border-left-color:${color}">
        <div class="req-post-top">
          <div class="rp-blood" style="background:${color}">${r.blood}</div>
          <div class="rp-info">
            <h4>${r.patientName} — ${r.bags} ব্যাগ দরকার</h4>
            <p>📌 ${r.hospital}</p>
          </div>
          <span class="rp-tag">🆘 জরুরি</span>
        </div>
        <div class="rp-details">
          <b>সমস্যা:</b> ${r.problem}<br>
          <b>কখন:</b> ${r.when ? new Date(r.when).toLocaleString('bn-BD') : '—'}<br>
          ${r.details ? `<b>বিস্তারিত:</b> ${r.details}<br>` : ''}
          <b>যোগাযোগ:</b> ${r.contactName}
        </div>
        <div class="rp-footer">
          <span class="time-ago">${timeAgo(r.createdAt)}</span>
        </div>
        <div class="rp-actions">
          <a class="rp-btn call" href="tel:${r.contactPhone}">📞 ${r.contactPhone}</a>
          <button class="rp-btn share" onclick="sharePost('${r.patientName}','${r.blood}','${r.hospital}','${r.contactPhone}')">🔗 Share</button>
        </div>
      </div>`;
    }).join('');
  });
};

// SHARE
window.sharePost = (name, blood, hospital, phone) => {
  const text = `🆘 জরুরি রক্তের অনুরোধ!\n\nরোগী: ${name}\nরক্তের গ্রুপ: ${blood}\nহাসপাতাল: ${hospital}\nযোগাযোগ: ${phone}\n\n🩸 LifeDrop — life-drop-ashen.vercel.app`;
  if(navigator.share){
    navigator.share({ title:'জরুরি রক্তের অনুরোধ', text });
  } else {
    navigator.clipboard.writeText(text);
    showToast('✅ কপি হয়েছে! Share করুন।');
  }
};
</script>
</body>
</html>
