<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="sondhan-logo.png"/>
<title>Sondhan — রক্তদাতা খুঁজুন</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.search-top{background:#fff;padding:11px 12px;border-bottom:1px solid #f0f0f0;flex-shrink:0;display:flex;flex-direction:column;gap:7px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.search-row{display:flex;gap:6px}
.sel-wrap{flex:1;display:flex;align-items:center;background:#f8f8f8;border:1.5px solid #eee;border-radius:10px;padding:0 10px}
.sel-wrap:focus-within{border-color:#c0392b}
.sel-wrap select{flex:1;border:none;background:transparent;padding:10px 0;font-size:12px;color:#222;outline:none;font-family:'Hind Siliguri',sans-serif}
.search-btn{padding:11px 16px;background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;border:none;border-radius:10px;font-size:13px;cursor:pointer;font-weight:700;font-family:'Hind Siliguri',sans-serif}
.results-list{flex:1;overflow-y:auto;padding:11px}
.hint-box{text-align:center;padding:40px 20px;color:#bbb}
.hint-box p{margin-top:8px;font-size:13px;font-family:'Hind Siliguri',sans-serif}
.result-header{font-size:11px;color:#aaa;font-family:'Hind Siliguri',sans-serif;margin-bottom:9px}
.dcard{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid #f0f0f0}
.dcard.featured{border-color:#c0392b;border-width:1.5px}
.dcard-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#fdecea,#fde);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#c0392b;flex-shrink:0;border:2px solid #fde;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.dinfo{flex:1;min-width:0}
.dname{font-size:14px;font-weight:700;color:#222;margin-bottom:3px;font-family:'Hind Siliguri',sans-serif}
.dbadges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.badge.blood{background:#c0392b;color:#fff}
.badge.urgent{background:#e67e22;color:#fff}
.badge.inactive{background:#eee;color:#aaa}
.dloc{font-size:11px;color:#aaa;font-family:'Hind Siliguri',sans-serif;margin-bottom:3px}
.phone-row{display:flex;align-items:center;gap:7px;background:#f0fff4;border:1px solid #c3e6cb;border-radius:10px;padding:8px 11px;margin-bottom:9px}
.phone-row span{font-size:12px;font-weight:600;color:#27ae60;font-family:'Inter',sans-serif;flex:1}
.phone-copy{background:none;border:none;font-size:15px;cursor:pointer}
.phone-hidden{display:flex;align-items:center;gap:7px;background:#f8f8f8;border:1px solid #eee;border-radius:10px;padding:8px 11px;margin-bottom:9px}
.dactions{display:flex;gap:6px}
.abtn{flex:1;padding:8px 4px;border-radius:9px;border:none;font-size:11px;font-weight:700;cursor:pointer;font-family:'Hind Siliguri',sans-serif;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:3px}
.abtn.call{background:#27ae60;color:#fff}
.abtn.wa{background:#25d366;color:#fff}
.abtn.req{background:#c0392b;color:#fff}
.abtn.view{background:#f0f0f0;color:#444}
.abtn.disabled{background:#eee;color:#ccc;cursor:not-allowed}
/* DONOR PROFILE MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding-bottom:20px}
.modal-header{background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;padding:14px 16px;border-radius:24px 24px 0 0;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:15px;font-weight:700;font-family:'Hind Siliguri',sans-serif}
.modal-close{background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.modal-body{padding:16px}
.dp-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#fdecea,#fde);border:3px solid #c0392b;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#c0392b;overflow:hidden}
.dp-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.info-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5}
.info-row:last-child{border-bottom:none}
.info-ico{font-size:15px;width:24px;text-align:center;flex-shrink:0}
.info-label{font-size:11px;color:#aaa;font-family:'Hind Siliguri',sans-serif;width:80px;flex-shrink:0}
.info-val{font-size:13px;font-weight:600;color:#333;font-family:'Hind Siliguri',sans-serif;flex:1}
/* REQ MODAL */
.iw{display:flex;align-items:center;background:#f8f8f8;border:1.5px solid #eee;border-radius:12px;padding:0 13px;margin-bottom:11px;transition:.2s}
.iw:focus-within{border-color:#c0392b;background:#fff}
.iw input,.iw select{flex:1;border:none;background:transparent;padding:12px 0;font-size:14px;outline:none;font-family:'Hind Siliguri',sans-serif}
.iico{font-size:15px;margin-right:10px;opacity:.6}
.req-area{width:100%;padding:11px;border:1.5px solid #eee;border-radius:12px;font-size:13px;resize:none;height:75px;font-family:'Hind Siliguri',sans-serif;outline:none;margin-bottom:11px}
.req-area:focus{border-color:#c0392b}
.submit-btn{width:100%;padding:13px;background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Hind Siliguri',sans-serif}
.form-group{margin-bottom:11px}
.form-group label{font-size:12px;font-weight:600;color:#666;display:block;margin-bottom:5px;font-family:'Hind Siliguri',sans-serif}
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.8);z-index:9999;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.spinner{width:38px;height:38px;border:4px solid #fde;border-top-color:#c0392b;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;z-index:9999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;font-family:'Hind Siliguri',sans-serif}
.toast.show{opacity:1}


/* ══ SEARCH LOADING ANIMATION ══ */
.search-loading{text-align:center;padding:44px 20px}
.drop-wrap{position:relative;width:54px;height:60px;margin:0 auto 6px}
.drop-svg{width:54px;height:54px;animation:dropBounce 1.1s ease-in-out infinite}
@keyframes dropBounce{
  0%,100%{transform:translateY(0) scale(1)}
  45%{transform:translateY(-10px) scale(0.94)}
  65%{transform:translateY(-7px) scale(0.96)}
}
.drop-shadow{width:28px;height:5px;border-radius:50%;background:rgba(192,57,43,0.18);margin:0 auto;animation:shadowPulse 1.1s ease-in-out infinite}
@keyframes shadowPulse{
  0%,100%{transform:scaleX(1);opacity:.4}
  45%{transform:scaleX(0.55);opacity:.15}
}
.loading-title{font-size:15px;font-weight:700;color:#1a1a1a;margin:14px 0 5px;font-family:'Hind Siliguri',sans-serif}
.loading-dots{display:inline-flex;gap:4px;vertical-align:middle;margin-left:2px}
.loading-dots span{width:5px;height:5px;border-radius:50%;background:#c0392b;display:inline-block;animation:dotPop 1.1s ease-in-out infinite}
.loading-dots span:nth-child(2){animation-delay:.18s}
.loading-dots span:nth-child(3){animation-delay:.36s}
@keyframes dotPop{
  0%,80%,100%{transform:scale(.7);opacity:.25}
  35%{transform:scale(1.15);opacity:1}
}
.loading-sub-text{font-size:12px;color:#aaa;font-family:'Hind Siliguri',sans-serif;line-height:1.6;min-height:18px;transition:opacity .3s}
.loading-bar-track{max-width:180px;height:3px;background:rgba(192,57,43,0.1);border-radius:3px;margin:16px auto 0;overflow:hidden}
.loading-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#c0392b,#e74c3c);animation:barSlide 1.6s ease-in-out infinite}
@keyframes barSlide{
  0%{width:0%;margin-left:0%}
  50%{width:65%;margin-left:18%}
  100%{width:0%;margin-left:100%}
}

</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-left">
      <a href="index.html" style="color:#fff;font-size:18px;text-decoration:none;background:rgba(255,255,255,.2);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:4px">←</a>
      <div class="sondhan-logo sondhan-logo--navbar-crop">
        <img src="sondhan-logo.png" alt="Sondhan" decoding="async" fetchpriority="high"/>
      </div>
      <h1>রক্তদাতা খুঁজুন</h1>
    </div>
    <div id="auth-info" style="font-size:11px;color:#fff;opacity:.85;font-family:'Hind Siliguri',sans-serif"></div>
  </div>

  <div class="search-top">
    <div class="search-row">
      <div class="sel-wrap">
        <select id="blood-filter">
          <option value="">রক্তের গ্রুপ</option>
          <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
        </select>
      </div>
      <div class="sel-wrap">
        <select id="div-filter" onchange="fillDist()">
          <option value="">বিভাগ</option>
          <option>ঢাকা</option><option>চট্টগ্রাম</option><option>খুলনা</option>
          <option>রাজশাহী</option><option>রংপুর</option><option>সিলেট</option>
          <option>বরিশাল</option><option>ময়মনসিংহ</option>
        </select>
      </div>
      <div class="sel-wrap">
        <select id="dist-filter"><option value="">জেলা</option></select>
      </div>
    </div>
    <button class="search-btn" onclick="searchDonors()">🔍 রক্তদাতা খুঁজুন</button>
  </div>

  <div class="results-list" id="results-list">
    <div class="hint-box">
      <div style="font-size:40px">🩸</div>
      <p>Blood group ও বিভাগ দিয়ে search করুন</p>
    </div>
  </div>

  <div class="bnav">
    <a class="bnav-item " data-tab="home" href="index.html"><span class="bi"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12L12 3L21 12V21H15V15H9V21H3V12Z"/></svg></span><span class="bl">হোম</span></a>
    <a class="bnav-item active" data-tab="search" href="search.html"><span class="bi"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg></span><span class="bl">খুঁজুন</span></a>
    <a class="bnav-center" href="request.html"><div class="bc-btn"><svg viewBox="0 0 24 24" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div><span class="bl">পোস্ট</span></a>
    <a class="bnav-item " data-tab="about" href="about.html"><span class="bi"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="8" r="1" fill="currentColor" stroke="none"/></svg></span><span class="bl">About Us</span></a>
    <a class="bnav-item " data-tab="profile" href="profile.html"><span class="bi"><svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-3 3.6-6 8-6s8 3 8 6"/></svg></span><span class="bl">প্রোফাইল</span></a>
  </div>
</div>

<!-- DONOR PROFILE MODAL -->
<div class="modal-bg" id="dp-modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <div class="modal-header"><h3 id="dp-title">Donor Profile</h3>
      <button class="modal-close" onclick="document.getElementById('dp-modal').classList.remove('open')">×</button>
    </div>
    <div class="modal-body" id="dp-body"></div>
  </div>
</div>

<!-- REQUEST MODAL -->
<div class="modal-bg" id="req-modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <div class="modal-header"><h3 id="req-title">রক্তের অনুরোধ</h3>
      <button class="modal-close" onclick="document.getElementById('req-modal').classList.remove('open')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="req-donor-id"/>
      <div class="form-group"><label>আপনার নাম *</label>
        <div class="iw"><span class="iico">👤</span><input type="text" id="req-name" placeholder="আপনার নাম"/></div>
      </div>
      <div class="form-group"><label>আপনার ফোন *</label>
        <div class="iw"><span class="iico">📞</span><input type="tel" id="req-phone" placeholder="01XXXXXXXXX"/></div>
      </div>
      <div class="form-group"><label>হাসপাতাল ও বিবরণ *</label>
        <textarea class="req-area" id="req-msg" placeholder="কোন হাসপাতাল, কখন লাগবে, রোগীর অবস্থা..."></textarea>
      </div>
      <button class="submit-btn" id="req-btn" onclick="submitReq()">🩸 অনুরোধ পাঠান</button>
    </div>
  </div>
</div>

<div id="loading" class="loading-overlay"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script>
const DISTRICTS={
  'ঢাকা':['ঢাকা','গাজীপুর','নারায়ণগঞ্জ','মানিকগঞ্জ','মুন্সীগঞ্জ','নরসিংদী','ফরিদপুর','গোপালগঞ্জ','মাদারীপুর','রাজবাড়ী','শরীয়তপুর','কিশোরগঞ্জ','টাঙ্গাইল'],
  'চট্টগ্রাম':['চট্টগ্রাম','কক্সবাজার','কুমিল্লা','ফেনী','নোয়াখালী','লক্ষ্মীপুর','চাঁদপুর','ব্রাহ্মণবাড়িয়া','রাঙামাটি','খাগড়াছড়ি','বান্দরবান'],
  'খুলনা':['খুলনা','বাগেরহাট','সাতক্ষীরা','যশোর','নড়াইল','মাগুরা','ঝিনাইদহ','কুষ্টিয়া','মেহেরপুর','চুয়াডাঙ্গা'],
  'রাজশাহী':['রাজশাহী','নাটোর','নওগাঁ','চাঁপাইনবাবগঞ্জ','পাবনা','সিরাজগঞ্জ','বগুড়া','জয়পুরহাট'],
  'রংপুর':['রংপুর','গাইবান্ধা','কুড়িগ্রাম','লালমনিরহাট','নীলফামারী','ঠাকুরগাঁও','পঞ্চগড়','দিনাজপুর'],
  'সিলেট':['সিলেট','মৌলভীবাজার','হবিগঞ্জ','সুনামগঞ্জ'],
  'বরিশাল':['বরিশাল','ভোলা','পটুয়াখালী','পিরোজপুর','ঝালকাঠি','বরগুনা'],
  'ময়মনসিংহ':['ময়মনসিংহ','জামালপুর','শেরপুর','নেত্রকোণা']
};
window.fillDist=()=>{
  const d=document.getElementById('div-filter').value;
  const s=document.getElementById('dist-filter');
  s.innerHTML='<option value="">জেলা</option>';
  (DISTRICTS[d]||[]).forEach(x=>s.innerHTML+=`<option>${x}</option>`);
};
// ini() সরানো হয়েছে — app.js এর initials() এখন ব্যবহার হচ্ছে
function starsHtml(r){let s='';for(let i=1;i<=5;i++)s+=`<span style="color:${i<=Math.round(r)?'#f39c12':'#ddd'};font-size:11px">★</span>`;return s;}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2700);}
function setLoad(v){document.getElementById('loading').classList.toggle('show',v);}

const _loadMsgs = [
  'আপনার নিকটবর্তী সক্রিয় রক্তদাতা খোঁজা হচ্ছে',
  'Sondhan ডেটাবেজ স্ক্যান করছে…',
  'সক্রিয় দাতাদের তালিকা তৈরি হচ্ছে…',
  'একটু অপেক্ষা করুন…'
];
let _loadTimer = null;
function startLoadingMsgs(){
  let i = 0;
  _loadTimer = setInterval(() => {
    i = (i+1) % _loadMsgs.length;
    const el = document.getElementById('loading-sub');
    if(el){ el.style.opacity='0'; setTimeout(()=>{ el.textContent=_loadMsgs[i]; el.style.opacity='1'; },200); }
  }, 1100);
}
function stopLoadingMsgs(){ clearInterval(_loadTimer); }

</script>

<script type="module">
import { auth, db } from './firebase-config.js';
import { esc, initials, waLink, telLink, isValidBdPhone } from './app.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { collection, getDocs, addDoc, doc, getDoc, query, where, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let CU = null;

// LOGIN GUARD
onAuthStateChanged(auth, user => {
  if(!user){ window.location.href='login.html?redirect=search.html'; return; }
  CU = user;
  document.getElementById('auth-info').textContent = user.displayName?.split(' ')[0]||'';
  // pre-fill request form
  document.getElementById('req-name').value = user.displayName||'';
});

// SEARCH — donors collection, JS filter
window.searchDonors = async () => {
  const blood = document.getElementById('blood-filter').value;
  const div   = document.getElementById('div-filter').value;
  const dist  = document.getElementById('dist-filter').value;
  if(!blood){ showToast('রক্তের গ্রুপ বেছে নিন'); return; }

  // Nice loading UI
  const el = document.getElementById('results-list');
  el.innerHTML = `<div class="search-loading">
  <div class="drop-wrap">
    <svg class="drop-svg" viewBox="0 0 54 54" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="dg" x1="27" y1="4" x2="27" y2="52" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#e74c3c"/>
          <stop offset="100%" stop-color="#922b21"/>
        </linearGradient>
      </defs>
      <path d="M27 4C27 4 9 20 9 32a18 18 0 0036 0C45 20 27 4 27 4Z" fill="url(#dg)"/>
      <path d="M20 32a7 7 0 017-7" stroke="rgba(255,255,255,0.5)" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="drop-shadow"></div>
  <div class="loading-title">সন্ধান চলছে<span class="loading-dots"><span></span><span></span><span></span></span></div>
  <div class="loading-sub-text" id="loading-sub">আপনার নিকটবর্তী সক্রিয় রক্তদাতা খোঁজা হচ্ছে</div>
  <div class="loading-bar-track"><div class="loading-bar-fill"></div></div>
</div>`;
  startLoadingMsgs();

  try {
    // BUGFIX (সবচেয়ে বড় সমস্যা): আগে এখানে পুরো 'donors' collection
    // ডাউনলোড হতো (getDocs(collection(db,'donors'))) — সব ইউজারের সব
    // ডেটা, সব ছবি (base64) — তারপর filter হতো JS দিয়ে। ১০০ donor
    // থাকলে প্রতি search-এ ২০-৩০MB ডাউনলোড হতো, আর rules-এও এখন
    // list-এ limit বাধ্যতামূলক। এখন filter সার্ভার-সাইডে হয়, limit(30)
    // সহ — শুধু প্রাসঙ্গিক ডেটা আসে, আর phone/wa আসেই না (donorsPrivate
    // আলাদা collection, list করা যায় না)।
    const filters = [where('blood','==',blood), where('available','==',true)];
    if (dist)      filters.push(where('district','==',dist));
    else if (div)  filters.push(where('division','==',div));

    const snap = await getDocs(query(collection(db,'donors'), ...filters, limit(30)));
    let donors = [];
    snap.forEach(d => donors.push({id:d.id, ...d.data()}));

    // rating বেশি যার আগে
    donors.sort((a,b) => (b.rating||0) - (a.rating||0));
    stopLoadingMsgs();
    renderResults(donors, blood);
  } catch(e){
    stopLoadingMsgs();
    console.warn('search error (Firestore composite index লাগতে পারে):', e);
    el.innerHTML = `<div class="hint-box"><p style="color:#c0392b">সমস্যা হয়েছে। আবার চেষ্টা করুন।</p></div>`;
  }
};

// শেষ search-এর ফলাফল এখানে রাখা হয় — viewProfile-এ আবার Firestore
// পড়তে হয় না (একটা কম read, আর দ্রুত)
let LAST_RESULTS = new Map();

function renderResults(donors, blood) {
  const el = document.getElementById('results-list');
  LAST_RESULTS = new Map(donors.map(d => [d.id, d]));

  if(!donors.length){
    el.innerHTML=`<div class="hint-box"><div style="font-size:36px">🩸</div><p><b>${esc(blood)}</b> donor পাওয়া যায়নি।</p></div>`;
    return;
  }
  // নিরাপত্তা: Firestore থেকে আসা প্রতিটা মান esc() দিয়ে পাস করানো হয়েছে,
  // আর onclick-এ নাম বসানোর বদলে data-attribute + event delegation ব্যবহার
  // হচ্ছে — তাই নামে ' বা " থাকলেও কিছু ভাঙে না।
  //
  // ফোন/WhatsApp এখন public donors ডেটায় নেই (donorsPrivate আলাদা) —
  // তাই "নম্বর দেখুন" চাপলে তখনই সেই একজন donor-এর জন্য আলাদা করে
  // fetch হয়, পুরো তালিকার জন্য না।
  el.innerHTML=`<div class="result-header">${esc(donors.length)} জন ${esc(blood)} donor পাওয়া গেছে</div>`+
  donors.map((d,i)=>{
    const avatarHtml = d.photo
      ? `<img src="${esc(d.photo)}" alt=""/>`
      : esc(initials(d.name));
    return `
    <div class="dcard ${i===0?'featured':''}">
      <div class="dcard-top">
        <div class="avatar">
          ${avatarHtml}
        </div>
        <div class="dinfo">
          <div class="dname">${esc(d.name)}</div>
          <div class="dbadges">
            <span class="badge blood">${esc(d.blood)}</span>
            ${d.urgentReady?'<span class="badge urgent">⚡ জরুরি</span>':''}
          </div>
          <div class="dloc">📌 ${esc([d.area,d.district,d.division].filter(Boolean).join(', '))}</div>
          <div style="font-size:11px;color:#aaa">${starsHtml(d.rating||0)} · ${esc(d.donations||0)} বার দান করেছেন</div>
        </div>
      </div>
      <div class="phone-row">
        <button class="reveal-btn" data-act="reveal" data-id="${esc(d.id)}" style="border:none;background:#fdecea;color:#c0392b;font-weight:700;font-size:12px;padding:8px 14px;border-radius:10px;cursor:pointer;font-family:'Hind Siliguri',sans-serif">🔒 নম্বর দেখুন</button>
      </div>
      <div class="dactions">
        <button class="abtn call" data-act="call" data-id="${esc(d.id)}">📞 Call</button>
        <button class="abtn wa" data-act="wa" data-id="${esc(d.id)}">💬 WA</button>
        <button class="abtn view" data-act="view" data-id="${esc(d.id)}">👤 Profile</button>
        <button class="abtn req" data-act="req" data-id="${esc(d.id)}">🩸 অনুরোধ</button>
      </div>
    </div>`;
  }).join('');
}

// donorsPrivate থেকে একজন donor-এর phone/wa একবারই আনে, ক্যাশ করে রাখে
async function ensurePrivate(id) {
  const d = LAST_RESULTS.get(id);
  if(!d) return null;
  if(d._revealed) return d;
  try {
    const snap = await getDoc(doc(db,'donorsPrivate',id));
    if(snap.exists()) Object.assign(d, snap.data());
    d._revealed = true;
    return d;
  } catch(e) {
    showToast('নম্বর দেখা যাচ্ছে না');
    return null;
  }
}

// ── EVENT DELEGATION — inline onclick-এর নিরাপদ বিকল্প ─────────
document.getElementById('results-list').addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]');
  if (!btn) return;
  const act = btn.dataset.act;

  if (act === 'reveal') {
    btn.textContent = 'লোড হচ্ছে...'; btn.disabled = true;
    const d = await ensurePrivate(btn.dataset.id);
    if(!d){ btn.disabled=false; btn.textContent='🔒 নম্বর দেখুন'; return; }
    btn.closest('.phone-row').innerHTML =
      `<span>📞 ${esc(d.phone||'—')}</span>
       <button class="phone-copy" data-act="copy" data-phone="${esc(d.phone||'')}">📋</button>`;
  } else if (act === 'copy') {
    navigator.clipboard?.writeText(btn.dataset.phone)
      .then(() => showToast('নম্বর কপি হয়েছে!'))
      .catch(() => showToast('কপি করা যায়নি'));
  } else if (act === 'call') {
    const d = await ensurePrivate(btn.dataset.id);
    if(!d || !d.phone){ showToast('নম্বর পাওয়া যায়নি'); return; }
    window.location.href = telLink(d.phone);
  } else if (act === 'wa') {
    const d = await ensurePrivate(btn.dataset.id);
    if(!d || !d.wa){ showToast('এই ডোনারের WhatsApp নম্বর নেই'); return; }
    window.open(waLink(d.wa), '_blank', 'noopener');
  } else if (act === 'view') {
    window.viewProfile(btn.dataset.id);
  } else if (act === 'req') {
    const d = LAST_RESULTS.get(btn.dataset.id);
    if (d) window.openReq(d.id, d.name, d.blood);
  }
});

// ── VIEW DONOR PROFILE ─────────────────────────────────────────
// আগে এখানে অকেজো কোড ছিল (একটা খালি donors array বানিয়ে ফেলে রাখা হতো)
// এবং প্রতিবার Firestore থেকে আবার পড়া হতো। এখন search-এর ক্যাশ থেকেই আসে।
window.viewProfile = (id) => {
  const d = LAST_RESULTS.get(id);
  if(!d){ showToast('পাওয়া যায়নি'); return; }

  document.getElementById('dp-title').textContent = `${d.name} (${d.blood})`;
  document.getElementById('dp-body').innerHTML=`
    <div style="text-align:center;margin-bottom:14px">
      <div class="dp-avatar">
        ${d.photo?`<img src="${esc(d.photo)}" alt=""/>`:`<span>${esc(initials(d.name))}</span>`}
      </div>
      <div style="font-size:17px;font-weight:800;font-family:'Inter',sans-serif">${esc(d.name)}</div>
      <span style="display:inline-block;background:#c0392b;color:#fff;font-size:12px;font-weight:700;padding:3px 14px;border-radius:20px;margin:6px 0">${esc(d.blood)}</span>
    </div>
    <div class="info-row"><span class="info-ico">📌</span><span class="info-label">অবস্থান</span><span class="info-val">${esc([d.area,d.district,d.division].filter(Boolean).join(', '))}</span></div>
    <div class="info-row" id="dp-phone-row"><span class="info-ico">📞</span><span class="info-label">ফোন</span><span class="info-val"><button data-act="reveal" data-id="${esc(d.id)}" style="border:none;background:#fdecea;color:#c0392b;font-weight:700;font-size:11px;padding:5px 10px;border-radius:8px;cursor:pointer;font-family:'Hind Siliguri',sans-serif">🔒 দেখুন</button></span></div>
    <div class="info-row"><span class="info-ico">🩸</span><span class="info-label">মোট দান</span><span class="info-val">${esc(d.donations||0)} বার</span></div>
    <div class="info-row"><span class="info-ico">📅</span><span class="info-label">শেষ দান</span><span class="info-val">${esc(d.lastDonation||(d.neverDonated?'এখনো দেননি':'—'))}</span></div>
    <div class="info-row"><span class="info-ico">⭐</span><span class="info-label">Rating</span><span class="info-val">${starsHtml(d.rating||0)} ${d.raters?'('+esc(d.raters)+' জন)':''}</span></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="abtn call" data-act="call" data-id="${esc(d.id)}" style="flex:1;padding:12px">📞 Call</button>
      <button class="abtn wa" data-act="wa" data-id="${esc(d.id)}" style="flex:1;padding:12px">💬 WhatsApp</button>
      <button class="abtn req" data-act="req" data-id="${esc(d.id)}" style="flex:1;padding:12px">🩸 অনুরোধ</button>
    </div>`;
  document.getElementById('dp-modal').classList.add('open');
};

// modal-এর ভেতরের সব বাটন (reveal/call/wa/req) একই delegation দিয়ে চলে
document.getElementById('dp-body').addEventListener('click', async e => {
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;

  if (act === 'reveal') {
    const d = await ensurePrivate(btn.dataset.id);
    if(!d) return;
    document.querySelector('#dp-phone-row .info-val').textContent = d.phone || '—';
  } else if (act === 'call') {
    const d = await ensurePrivate(btn.dataset.id);
    if(!d || !d.phone){ showToast('নম্বর পাওয়া যায়নি'); return; }
    window.location.href = telLink(d.phone);
  } else if (act === 'wa') {
    const d = await ensurePrivate(btn.dataset.id);
    if(!d || !d.wa){ showToast('এই ডোনারের WhatsApp নম্বর নেই'); return; }
    window.open(waLink(d.wa), '_blank', 'noopener');
  } else if (act === 'req') {
    const d = LAST_RESULTS.get(btn.dataset.id);
    if(d){ document.getElementById('dp-modal').classList.remove('open'); window.openReq(d.id,d.name,d.blood); }
  }
});

// REQUEST
window.openReq = (id,name,blood) => {
  document.getElementById('req-donor-id').value = id;
  document.getElementById('req-title').textContent = `${name} (${blood}) কে অনুরোধ`;
  document.getElementById('req-modal').classList.add('open');
};

window.submitReq = async () => {
  const id    = document.getElementById('req-donor-id').value;
  const name  = document.getElementById('req-name').value.trim();
  const phone = document.getElementById('req-phone').value.trim();
  const msg   = document.getElementById('req-msg').value.trim();
  if(!name||!phone||!msg){ showToast('সব তথ্য পূরণ করুন'); return; }
  if(!isValidBdPhone(phone)){ showToast('সঠিক মোবাইল নম্বর দিন (01XXXXXXXXX)'); return; }
  if(msg.length > 500){ showToast('বার্তা ৫০০ অক্ষরের কম রাখুন'); return; }
  const btn = document.getElementById('req-btn');
  btn.textContent='পাঠানো হচ্ছে...'; btn.disabled=true;
  try {
    await addDoc(collection(db,'requests'),{
      donorId:id, seekerName:name, seekerPhone:phone,
      seekerUid:CU.uid, msg, status:'pending',
      createdAt:serverTimestamp()
    });
    document.getElementById('req-modal').classList.remove('open');
    document.getElementById('req-msg').value='';
    showToast('✅ অনুরোধ পাঠানো হয়েছে!');
  } catch(e){ showToast('অনুরোধ পাঠানো যায়নি'); console.warn(e); }
  finally{ btn.textContent='🩸 অনুরোধ পাঠান'; btn.disabled=false; }
};
</script>
