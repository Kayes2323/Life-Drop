<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeDrop — রক্তদাতা খুঁজুন</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.search-top{background:#fff;padding:11px 12px;border-bottom:1px solid #f0f0f0;flex-shrink:0;display:flex;flex-direction:column;gap:7px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
.search-row{display:flex;gap:6px}
.sel-wrap{flex:1;display:flex;align-items:center;background:#f8f8f8;border:1.5px solid #eee;border-radius:10px;padding:0 10px}
.sel-wrap:focus-within{border-color:#c0392b}
.sel-wrap select{flex:1;border:none;background:transparent;padding:10px 0;font-size:12px;color:#222;outline:none;font-family:'Hind Siliguri',sans-serif}
.search-btn{padding:11px 16px;background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;border:none;border-radius:10px;font-size:13px;cursor:pointer;font-weight:700;font-family:'Hind Siliguri',sans-serif}
.results-list{flex:1;overflow-y:auto;padding:11px}
.hint-box{text-align:center;padding:40px 20px;color:#bbb}
.hint-box p{margin-top:8px;font-size:13px;font-family:'Hind Siliguri',sans-serif}
.result-header{font-size:11px;color:#aaa;font-family:'Hind Siliguri',sans-serif;margin-bottom:9px}
.dcard{background:#fff;border-radius:14px;padding:13px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);border:1px solid #f0f0f0}
.dcard.featured{border-color:#c0392b;border-width:1.5px}
.dcard-top{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#fdecea,#fde);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;color:#c0392b;flex-shrink:0;border:2px solid #fde;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.dinfo{flex:1;min-width:0}
.dname{font-size:14px;font-weight:700;color:#222;margin-bottom:3px;font-family:'Hind Siliguri',sans-serif}
.dbadges{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px}
.badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px}
.badge.blood{background:#c0392b;color:#fff}
.badge.urgent{background:#e67e22;color:#fff}
.badge.inactive{background:#eee;color:#aaa}
.dloc{font-size:11px;color:#aaa;font-family:'Hind Siliguri',sans-serif;margin-bottom:3px}
.phone-row{display:flex;align-items:center;gap:7px;background:#f0fff4;border:1px solid #c3e6cb;border-radius:10px;padding:8px 11px;margin-bottom:9px}
.phone-row span{font-size:12px;font-weight:600;color:#27ae60;font-family:'Inter',sans-serif;flex:1}
.phone-copy{background:none;border:none;font-size:15px;cursor:pointer}
.phone-hidden{display:flex;align-items:center;gap:7px;background:#f8f8f8;border:1px solid #eee;border-radius:10px;padding:8px 11px;margin-bottom:9px}
.dactions{display:flex;gap:6px}
.abtn{flex:1;padding:8px 4px;border-radius:9px;border:none;font-size:11px;font-weight:700;cursor:pointer;font-family:'Hind Siliguri',sans-serif;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center;gap:3px}
.abtn.call{background:#27ae60;color:#fff}
.abtn.wa{background:#25d366;color:#fff}
.abtn.req{background:#c0392b;color:#fff}
.abtn.view{background:#f0f0f0;color:#444}
.abtn.disabled{background:#eee;color:#ccc;cursor:not-allowed}
/* DONOR PROFILE MODAL */
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:999;align-items:flex-end;justify-content:center}
.modal-bg.open{display:flex}
.modal{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding-bottom:20px}
.modal-header{background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;padding:14px 16px;border-radius:24px 24px 0 0;display:flex;justify-content:space-between;align-items:center}
.modal-header h3{font-size:15px;font-weight:700;font-family:'Hind Siliguri',sans-serif}
.modal-close{background:none;border:none;color:#fff;font-size:24px;cursor:pointer}
.modal-body{padding:16px}
.dp-avatar{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#fdecea,#fde);border:3px solid #c0392b;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800;color:#c0392b;overflow:hidden}
.dp-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.info-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5}
.info-row:last-child{border-bottom:none}
.info-ico{font-size:15px;width:24px;text-align:center;flex-shrink:0}
.info-label{font-size:11px;color:#aaa;font-family:'Hind Siliguri',sans-serif;width:80px;flex-shrink:0}
.info-val{font-size:13px;font-weight:600;color:#333;font-family:'Hind Siliguri',sans-serif;flex:1}
/* REQ MODAL */
.iw{display:flex;align-items:center;background:#f8f8f8;border:1.5px solid #eee;border-radius:12px;padding:0 13px;margin-bottom:11px;transition:.2s}
.iw:focus-within{border-color:#c0392b;background:#fff}
.iw input,.iw select{flex:1;border:none;background:transparent;padding:12px 0;font-size:14px;outline:none;font-family:'Hind Siliguri',sans-serif}
.iico{font-size:15px;margin-right:10px;opacity:.6}
.req-area{width:100%;padding:11px;border:1.5px solid #eee;border-radius:12px;font-size:13px;resize:none;height:75px;font-family:'Hind Siliguri',sans-serif;outline:none;margin-bottom:11px}
.req-area:focus{border-color:#c0392b}
.submit-btn{width:100%;padding:13px;background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Hind Siliguri',sans-serif}
.form-group{margin-bottom:11px}
.form-group label{font-size:12px;font-weight:600;color:#666;display:block;margin-bottom:5px;font-family:'Hind Siliguri',sans-serif}
.loading-overlay{display:none;position:fixed;inset:0;background:rgba(255,255,255,.8);z-index:9999;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.spinner{width:38px;height:38px;border:4px solid #fde;border-top-color:#c0392b;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 22px;border-radius:24px;font-size:13px;z-index:9999;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;font-family:'Hind Siliguri',sans-serif}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="header-left">
      <a href="index.html" style="color:#fff;font-size:18px;text-decoration:none;background:rgba(255,255,255,.2);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:4px">←</a>
      <span class="logo-drop">🩸</span>
      <h1>রক্তদাতা খুঁজুন</h1>
    </div>
    <div id="auth-info" style="font-size:11px;color:#fff;opacity:.85;font-family:'Hind Siliguri',sans-serif"></div>
  </div>

  <div class="search-top">
    <div class="search-row">
      <div class="sel-wrap">
        <select id="blood-filter">
          <option value="">রক্তের গ্রুপ</option>
          <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
        </select>
      </div>
      <div class="sel-wrap">
        <select id="div-filter" onchange="fillDist()">
          <option value="">বিভাগ</option>
          <option>ঢাকা</option><option>চট্টগ্রাম</option><option>খুলনা</option>
          <option>রাজশাহী</option><option>রংপুর</option><option>সিলেট</option>
          <option>বরিশাল</option><option>ময়মনসিংহ</option>
        </select>
      </div>
      <div class="sel-wrap">
        <select id="dist-filter"><option value="">জেলা</option></select>
      </div>
    </div>
    <button class="search-btn" onclick="searchDonors()">🔍 রক্তদাতা খুঁজুন</button>
  </div>

  <div class="results-list" id="results-list">
    <div class="hint-box">
      <div style="font-size:40px">🩸</div>
      <p>Blood group ও বিভাগ দিয়ে search করুন</p>
    </div>
  </div>

  <div class="bnav">
    <a class="bnav-item" href="index.html"><span class="bi">🏠</span><span class="bl">হোম</span></a>
    <a class="bnav-item active" href="search.html"><span class="bi">🔍</span><span class="bl">খুঁজুন</span></a>
    <a class="bnav-center" href="request.html"><div class="bc-btn">🆘</div><span class="bl">অনুরোধ</span></a>
    <a class="bnav-item" href="about.html"><span class="bi">ℹ️</span><span class="bl">About</span></a>
    <a class="bnav-item" href="profile.html"><span class="bi">👤</span><span class="bl">Profile</span></a>
  </div>
</div>

<!-- DONOR PROFILE MODAL -->
<div class="modal-bg" id="dp-modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <div class="modal-header"><h3 id="dp-title">Donor Profile</h3>
      <button class="modal-close" onclick="document.getElementById('dp-modal').classList.remove('open')">×</button>
    </div>
    <div class="modal-body" id="dp-body"></div>
  </div>
</div>

<!-- REQUEST MODAL -->
<div class="modal-bg" id="req-modal" onclick="if(event.target===this)this.classList.remove('open')">
  <div class="modal">
    <div class="modal-header"><h3 id="req-title">রক্তের অনুরোধ</h3>
      <button class="modal-close" onclick="document.getElementById('req-modal').classList.remove('open')">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="req-donor-id"/>
      <div class="form-group"><label>আপনার নাম *</label>
        <div class="iw"><span class="iico">👤</span><input type="text" id="req-name" placeholder="আপনার নাম"/></div>
      </div>
      <div class="form-group"><label>আপনার ফোন *</label>
        <div class="iw"><span class="iico">📞</span><input type="tel" id="req-phone" placeholder="01XXXXXXXXX"/></div>
      </div>
      <div class="form-group"><label>হাসপাতাল ও বিবরণ *</label>
        <textarea class="req-area" id="req-msg" placeholder="কোন হাসপাতাল, কখন লাগবে, রোগীর অবস্থা..."></textarea>
      </div>
      <button class="submit-btn" id="req-btn" onclick="submitReq()">🩸 অনুরোধ পাঠান</button>
    </div>
  </div>
</div>

<div id="loading" class="loading-overlay"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script>
const DISTRICTS={
  'ঢাকা':['ঢাকা','গাজীপুর','নারায়ণগঞ্জ','মানিকগঞ্জ','মুন্সীগঞ্জ','নরসিংদী','ফরিদপুর','গোপালগঞ্জ','মাদারীপুর','রাজবাড়ী','শরীয়তপুর','কিশোরগঞ্জ','টাঙ্গাইল'],
  'চট্টগ্রাম':['চট্টগ্রাম','কক্সবাজার','কুমিল্লা','ফেনী','নোয়াখালী','লক্ষ্মীপুর','চাঁদপুর','ব্রাহ্মণবাড়িয়া','রাঙামাটি','খাগড়াছড়ি','বান্দরবান'],
  'খুলনা':['খুলনা','বাগেরহাট','সাতক্ষীরা','যশোর','নড়াইল','মাগুরা','ঝিনাইদহ','কুষ্টিয়া','মেহেরপুর','চুয়াডাঙ্গা'],
  'রাজশাহী':['রাজশাহী','নাটোর','নওগাঁ','চাঁপাইনবাবগঞ্জ','পাবনা','সিরাজগঞ্জ','বগুড়া','জয়পুরহাট'],
  'রংপুর':['রংপুর','গাইবান্ধা','কুড়িগ্রাম','লালমনিরহাট','নীলফামারী','ঠাকুরগাঁও','পঞ্চগড়','দিনাজপুর'],
  'সিলেট':['সিলেট','মৌলভীবাজার','হবিগঞ্জ','সুনামগঞ্জ'],
  'বরিশাল':['বরিশাল','ভোলা','পটুয়াখালী','পিরোজপুর','ঝালকাঠি','বরগুনা'],
  'ময়মনসিংহ':['ময়মনসিংহ','জামালপুর','শেরপুর','নেত্রকোণা']
};
window.fillDist=()=>{
  const d=document.getElementById('div-filter').value;
  const s=document.getElementById('dist-filter');
  s.innerHTML='<option value="">জেলা</option>';
  (DISTRICTS[d]||[]).forEach(x=>s.innerHTML+=`<option>${x}</option>`);
};
function ini(n){return(n||'D').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();}
function starsHtml(r){let s='';for(let i=1;i<=5;i++)s+=`<span style="color:${i<=Math.round(r)?'#f39c12':'#ddd'};font-size:11px">★</span>`;return s;}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2700);}
function setLoad(v){document.getElementById('loading').classList.toggle('show',v);}
</script>

<script type="module">
import { auth, db } from './firebase-config.js';
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { collection, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let CU = null;

// LOGIN GUARD
onAuthStateChanged(auth, user => {
  if(!user){ window.location.href='login.html?redirect=search.html'; return; }
  CU = user;
  document.getElementById('auth-info').textContent = user.displayName?.split(' ')[0]||'';
  // pre-fill request form
  document.getElementById('req-name').value = user.displayName||'';
});

// SEARCH — donors collection, JS filter
window.searchDonors = async () => {
  const blood = document.getElementById('blood-filter').value;
  const div   = document.getElementById('div-filter').value;
  const dist  = document.getElementById('dist-filter').value;
  if(!blood){ showToast('রক্তের গ্রুপ বেছে নিন'); return; }

  // Nice loading UI
  const el = document.getElementById('results-list');
  el.innerHTML = `
    <div style="text-align:center;padding:40px 20px">
      <div style="width:48px;height:48px;border:4px solid #fde;border-top-color:#c0392b;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px"></div>
      <p style="font-size:13px;color:#c0392b;font-weight:600;font-family:'Hind Siliguri',sans-serif;margin-bottom:6px">আপনার নিকটবর্তী রক্তদাতা খোঁজা হচ্ছে</p>
      <p style="font-size:12px;color:#aaa;font-family:'Hind Siliguri',sans-serif">অনুগ্রহ করে অপেক্ষা করুন...</p>
    </div>
    <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;

  try {
    const snap = await getDocs(collection(db,'donors'));
    let donors = [];
    snap.forEach(d => donors.push({id:d.id,...d.data()}));

    // JS filter
    donors = donors.filter(d => {
      if(d.blood !== blood) return false;
      if(div && d.division !== div) return false;
      if(dist && d.district !== dist) return false;
      return true;
    });

    // active donors আগে
    donors.sort((a,b) => (b.available?1:0) - (a.available?1:0));
    renderResults(donors, blood);
  } catch(e){
    el.innerHTML = `<div class="hint-box"><p style="color:#c0392b">সমস্যা হয়েছে। আবার চেষ্টা করুন।</p></div>`;
  }
};

function renderResults(donors, blood) {
  const el = document.getElementById('results-list');
  if(!donors.length){
    el.innerHTML=`<div class="hint-box"><div style="font-size:36px">🩸</div><p><b>${blood}</b> donor পাওয়া যায়নি।</p></div>`;
    return;
  }
  el.innerHTML=`<div class="result-header">${donors.length} জন ${blood} donor পাওয়া গেছে</div>`+
  donors.map((d,i)=>{
    const av = d.available;
    const avatarHtml = d.photo
      ? `<img src="${d.photo}" />`
      : ini(d.name);
    return `
    <div class="dcard ${i===0&&av?'featured':''}">
      <div class="dcard-top">
        <div class="avatar" style="${!av?'opacity:.5':''}">
          ${avatarHtml}
        </div>
        <div class="dinfo">
          <div class="dname" style="${!av?'color:#aaa':''}">${d.name}</div>
          <div class="dbadges">
            <span class="badge blood">${d.blood}</span>
            ${d.urgentReady&&av?'<span class="badge urgent">⚡ জরুরি</span>':''}
            ${!av?'<span class="badge inactive">⏸ অপ্রস্তুত</span>':''}
          </div>
          <div class="dloc">📌 ${[d.area,d.district,d.division].filter(Boolean).join(', ')}</div>
          <div style="font-size:11px;color:#aaa">${starsHtml(d.rating||0)} · ${d.donations||0} বার দান করেছেন</div>
        </div>
      </div>
      ${av
        ?        `<div class="dactions">
            <a class="abtn call" href="tel:${d.phone}">📞 Call</a>
            ${d.wa?`<a class="abtn wa" href="https://wa.me/${d.wa.replace(/\D/g,'')}" target="_blank">💬 WA</a>`:''}
            <button class="abtn view" onclick="viewProfile('${d.id}')">👤 Profile</button>
            <button class="abtn req" onclick="openReq('${d.id}','${d.name}','${d.blood}')">🩸 অনুরোধ</button>
          </div>`
        :`<div class="phone-hidden">
            <span>🔒 <b style="color:#c0392b">Donor রক্ত দিতে প্রস্তুত নন</b></span>
          </div>
          <div class="dactions">
            <button class="abtn disabled" disabled>📞 Call</button>
            <button class="abtn view" onclick="viewProfile('${d.id}')">👤 Profile</button>
            <button class="abtn req" onclick="openReq('${d.id}','${d.name}','${d.blood}')">🩸 অনুরোধ</button>
          </div>`
      }
    </div>`;
  }).join('');
}

// VIEW DONOR PROFILE
window.viewProfile = (id) => {
  const donors = [];
  document.querySelectorAll('.dcard').forEach((_, i) => donors.push(i));
  // find from last search result using DOM data — re-fetch or cache
  showToast('Profile লোড হচ্ছে...');
  import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js").then(({doc,getDoc})=>{
    getDoc(doc(db,'donors',id)).then(snap=>{
      if(!snap.exists()){ showToast('পাওয়া যায়নি'); return; }
      const d = snap.data();
      const av = d.available;
      document.getElementById('dp-title').textContent = d.name+' ('+d.blood+')';
      document.getElementById('dp-body').innerHTML=`
        <div style="text-align:center;margin-bottom:14px">
          <div class="dp-avatar">
            ${d.photo?`<img src="${d.photo}"/>`:`<span>${ini(d.name)}</span>`}
          </div>
          <div style="font-size:17px;font-weight:800;font-family:'Inter',sans-serif">${d.name}</div>
          <span style="display:inline-block;background:#c0392b;color:#fff;font-size:12px;font-weight:700;padding:3px 14px;border-radius:20px;margin:6px 0">${d.blood}</span>
        </div>
        <div class="info-row"><span class="info-ico">📌</span><span class="info-label">অবস্থান</span><span class="info-val">${[d.area,d.district,d.division].filter(Boolean).join(', ')}</span></div>
        <div class="info-row"><span class="info-ico">📞</span><span class="info-label">ফোন</span><span class="info-val">${av?(d.phone||'—'):'<i style="color:#bbb;font-size:11px">Phone number is not available</i>'}</span></div>
        <div class="info-row"><span class="info-ico">🩸</span><span class="info-label">মোট দান</span><span class="info-val">${d.donations||0} বার</span></div>
        <div class="info-row"><span class="info-ico">📅</span><span class="info-label">শেষ দান</span><span class="info-val">${d.lastDonation||(d.neverDonated?'এখনো দেননি':'—')}</span></div>
        <div class="info-row"><span class="info-ico">⭐</span><span class="info-label">Rating</span><span class="info-val">${starsHtml(d.rating||0)} ${d.raters?'('+d.raters+' জন)':''}</span></div>
        ${av?`<div style="display:flex;gap:8px;margin-top:14px">
          <a class="abtn call" href="tel:${d.phone}" style="flex:1;padding:12px">📞 Call</a>
          ${d.wa?`<a class="abtn wa" href="https://wa.me/${d.wa.replace(/\D/g,'')}" target="_blank" style="flex:1;padding:12px">💬 WhatsApp</a>`:''}
          <button class="abtn req" onclick="openReq('${snap.id}','${d.name}','${d.blood}')" style="flex:1;padding:12px">🩸 অনুরোধ</button>
        </div>`:''}`;
      document.getElementById('dp-modal').classList.add('open');
    });
  });
};

// REQUEST
window.openReq = (id,name,blood) => {
  document.getElementById('req-donor-id').value = id;
  document.getElementById('req-title').textContent = `${name} (${blood}) কে অনুরোধ`;
  document.getElementById('req-modal').classList.add('open');
};

window.submitReq = async () => {
  const id    = document.getElementById('req-donor-id').value;
  const name  = document.getElementById('req-name').value.trim();
  const phone = document.getElementById('req-phone').value.trim();
  const msg   = document.getElementById('req-msg').value.trim();
  if(!name||!phone||!msg){ showToast('সব তথ্য পূরণ করুন'); return; }
  const btn = document.getElementById('req-btn');
  btn.textContent='পাঠানো হচ্ছে...'; btn.disabled=true;
  try {
    await addDoc(collection(db,'requests'),{
      donorId:id, seekerName:name, seekerPhone:phone,
      seekerUid:CU.uid, msg, status:'pending',
      createdAt:serverTimestamp()
    });
    document.getElementById('req-modal').classList.remove('open');
    document.getElementById('req-msg').value='';
    showToast('✅ অনুরোধ পাঠানো হয়েছে!');
  } catch(e){ showToast('Error: '+e.message); }
  finally{ btn.textContent='🩸 অনুরোধ পাঠান'; btn.disabled=false; }
};
</script>
</body>
</html>
